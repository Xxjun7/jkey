<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>j808 管理面板 - 英雄聯盟風格</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --lol-gold-1: #f0e6d2;
        --lol-gold-2: #c8aa6e;
        --lol-gold-3: #785a28;
        --lol-gold-4: #463714;
        --lol-hextech-blue: #0ac8b9;
        --lol-hextech-glow: rgba(10, 200, 185, .4);
        --lol-purple-dark: #090614;
        --lol-purple-panel: rgba(20, 16, 38, .75);
        --lol-purple-border: rgba(120, 90, 40, .6);
        --lol-purple-glow: rgba(147, 51, 234, .25);
        --lol-red: #e84057;
        --lol-green: #20c997;
        --w-no: 55px;
        --w-level: 70px;
        --w-name: 180px;
        --w-receive: 65px;
        --w-coin: 85px;
        --w-friend: 85px;
        --w-phone: 85px;
        --w-action: 120px;
        --row-height: 42px;
      }

      * {
        box-sizing: border-box
      }

      html,
      body {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        margin: 0;
        overflow-x: hidden !important;
        position: relative
      }

      body {
        font-family: 'Noto Sans TC', 'Cinzel', Arial, sans-serif;
        padding: 20px;
        background: #05030a radial-gradient(circle at 50% 20%, #1a0f35 0%, #06040d 70%);
        color: var(--lol-gold-1);
        min-height: 100vh;
        background-attachment: fixed
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px
      }

      ::-webkit-scrollbar-track {
        background: rgba(5, 3, 10, .9);
        border-left: 1px solid rgba(120, 90, 40, .3);
        border-right: 1px solid rgba(120, 90, 40, .3)
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #785a28 0%, #463714 100%);
        border: 1px solid var(--lol-gold-2);
        border-radius: 2px
      }

      .header-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        border-bottom: 2px solid var(--lol-gold-3);
        padding: 20px;
        margin-bottom: 20px;
        position: relative;
        background: var(--lol-purple-panel);
        backdrop-filter: blur(10px);
        border-radius: 4px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, .7), inset 0 0 15px var(--lol-purple-glow);
        border: 1px solid var(--lol-gold-3)
      }

      h2 {
        margin: 0;
        font-family: 'Cinzel', 'Noto Sans TC', serif;
        font-size: 26px;
        text-align: center;
        color: var(--lol-gold-1);
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(200, 170, 110, .5), 0 0 20px rgba(120, 90, 40, .8);
        font-weight: 700
      }

      .login-box {
        background: rgba(10, 8, 20, .8);
        padding: 12px 16px;
        border-radius: 2px;
        border: 1px solid var(--lol-gold-3);
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
        font-size: 15px;
        width: 100%;
        box-shadow: inset 0 0 8px rgba(0, 0, 0, .8)
      }

      .login-form-inner {
        display: flex;
        gap: 8px;
        width: 100%
      }

      input[type=text],
      input[type=password],
      input[type=number] {
        background: rgba(5, 3, 10, .7);
        color: var(--lol-gold-1);
        padding: 8px 10px;
        border: 1px solid var(--lol-gold-3);
        border-radius: 2px;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color .3s ease, box-shadow .3s ease;
        outline: none;
        width: auto;
        min-width: 60px;
        max-width: 300px
      }

      input[type=text]:focus,
      input[type=password]:focus,
      input[type=number]:focus {
        border-color: var(--lol-hextech-blue);
        box-shadow: 0 0 8px var(--lol-hextech-glow);
        background: rgba(10, 15, 25, .9)
      }

      input:read-only {
        background: rgba(15, 12, 25, .3);
        border-color: rgba(120, 90, 40, .2);
        color: var(--lol-gold-1);
        cursor: pointer
      }

      input:read-only:hover {
        border-color: var(--lol-hextech-blue);
        background: rgba(10, 200, 185, .1)
      }

      .user-status {
        font-weight: bold;
        color: var(--lol-gold-2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%
      }

      .btn-container {
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 2px;
        border: 1px solid var(--lol-gold-2);
        background: linear-gradient(180deg, #1e2328 0%, #111318 100%);
        color: var(--lol-gold-2);
        font-size: 14px;
        font-weight: 700;
        font-family: 'Cinzel', 'Noto Sans TC', serif;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: all .2s ease;
        position: relative;
        box-shadow: 0 0 5px rgba(0, 0, 0, .8)
      }

      button:hover {
        color: var(--lol-gold-1);
        border-color: var(--lol-gold-1);
        background: linear-gradient(180deg, #2b3138 0%, #1a1d24 100%);
        box-shadow: 0 0 10px rgba(200, 170, 110, .4)
      }

      button:active {
        transform: translateY(1px)
      }

      .btn-add {
        border-color: #1e7e34;
        color: #5cdb95;
        background: linear-gradient(180deg, #122b1c 0%, #08140d 100%);
        flex: 1;
        min-width: 110px
      }

      .btn-add:hover {
        border-color: #28a745;
        color: #fff;
        box-shadow: 0 0 10px rgba(40, 167, 69, .5);
        background: linear-gradient(180deg, #193d27 0%, #0d2115 100%)
      }

      .btn-unlock {
        border-color: #b8860b;
        color: #ffd700;
        background: linear-gradient(180deg, #3d3014 0%, #181206 100%);
        flex: 1;
        min-width: 130px
      }

      .btn-unlock:hover {
        border-color: #ffd700;
        color: #fff;
        box-shadow: 0 0 10px rgba(255, 215, 0, .5);
        background: linear-gradient(180deg, #57441d 0%, #241a09 100%)
      }

      .btn-unlock.unlocked {
        border-color: var(--lol-hextech-blue);
        color: var(--lol-hextech-blue);
        background: linear-gradient(180deg, #092830 0%, #031015 100%);
        box-shadow: 0 0 8px var(--lol-hextech-glow)
      }

      .btn-reset {
        border-color: #a71d2a;
        color: #ff6b6b;
        background: linear-gradient(180deg, #381216 0%, #1a080a 100%);
        flex: 1;
        min-width: 130px
      }

      .btn-reset:hover {
        border-color: var(--lol-red);
        color: #fff;
        box-shadow: 0 0 10px rgba(232, 64, 87, .5);
        background: linear-gradient(180deg, #521a20 0%, #290d10 100%)
      }

      .btn-save {
        border-color: var(--lol-hextech-blue);
        color: var(--lol-hextech-blue);
        background: linear-gradient(180deg, #092830 0%, #031015 100%);
        flex: 1;
        min-width: 150px
      }

      .btn-load {
        border-color: var(--lol-gold-2);
        color: var(--lol-gold-2);
        background: linear-gradient(180deg, #3d3014 0%, #181206 100%);
        flex: 1;
        min-width: 150px
      }

      .btn-login {
        border-color: var(--lol-gold-3);
        color: var(--lol-gold-2);
        white-space: nowrap;
        padding: 8px 16px
      }

      /* ===== 核心修正：表格只允許 .table-responsive 橫向滾動 ===== */
      .table-responsive {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto;
        overflow-y: visible;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        border: 1px solid var(--lol-gold-3);
        border-radius: 4px;
        background: var(--lol-purple-panel);
        backdrop-filter: blur(10px);
        margin-top: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .8);
        contain: layout paint;
        isolation: isolate;
      }

      .table-scroll-lock {
        width: max-content;
        min-width: 100%;
        max-width: none;
      }

      table {
        display: table;
        width: max-content;
        min-width: 100%;
        max-width: none;
        table-layout: fixed;
        border-collapse: collapse;
        border-spacing: 0;
      }

      tbody tr {
        height: var(--row-height)
      }

      th,
      td {
        height: var(--row-height);
        border: 1px solid rgba(120, 90, 40, .3);
        padding: 0 6px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-sizing: border-box;
      }

      th {
        background: rgba(15, 11, 25, .9);
        color: var(--lol-gold-2);
        font-family: 'Cinzel', 'Noto Sans TC', serif;
        font-size: 14px;
        letter-spacing: 1px;
        border-bottom: 2px solid var(--lol-gold-3)
      }

      th:nth-child(1),
      td:nth-child(1) {
        width: var(--w-no);
        min-width: var(--w-no)
      }

      th:nth-child(2),
      td:nth-child(2) {
        width: var(--w-level);
        min-width: var(--w-level)
      }

      th:nth-child(3),
      td:nth-child(3) {
        width: var(--w-name);
        min-width: var(--w-name)
      }

      th.col-collapsible-r,
      td.col-collapsible-r {
        width: var(--w-receive);
        min-width: var(--w-receive)
      }

      th:nth-child(9),
      td:nth-child(9) {
        width: var(--w-coin);
        min-width: var(--w-coin)
      }

      th.col-collapsible-f,
      td.col-collapsible-f {
        width: var(--w-friend);
        min-width: var(--w-friend)
      }

      th.col-phone-th,
      td.col-phone-td {
        width: var(--w-phone);
        min-width: var(--w-phone)
      }

      th.user-only,
      td.user-only,
      th.admin-only,
      td.admin-only {
        width: var(--w-action);
        min-width: var(--w-action)
      }

      .name-cell-container {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        height: 100%;
        min-width: 0
      }

      table input[type=text] {
        width: 100% !important;
        height: calc(var(--row-height) - 6px) !important;
        max-width: none !important;
        min-width: 0 !important;
        font-size: 14px !important;
        padding: 0 4px !important;
        text-align: center;
        box-sizing: border-box !important
      }

      th.toggle-trigger {
        cursor: pointer;
        touch-action: manipulation;
        user-select: none
      }

      th.toggle-trigger:hover {
        color: var(--lol-hextech-blue);
        background: rgba(10, 200, 185, .12);
        text-shadow: 0 0 8px var(--lol-hextech-glow)
      }

      /* 重要：移除 all transition，避免 Safari 快速切換時累積 layout */
      .col-collapsible-r,
      .col-collapsible-f {
        transition: none !important
      }

      .collapsed-r .col-collapsible-r,
      .collapsed-f .col-collapsible-f {
        display: none !important
      }

      tbody tr:hover {
        background: rgba(147, 51, 234, .08)
      }

      tbody tr.row-hidden {
        display: none !important
      }

      tbody tr.dragging {
        opacity: .4;
        background: rgba(10, 200, 185, .15) !important
      }

      .action-buttons-group {
        display: flex;
        gap: 4px;
        justify-content: center;
        align-items: center
      }

      .drag-handle {
        cursor: grab;
        padding: 2px 8px;
        color: var(--lol-gold-2);
        border: 1px solid var(--lol-gold-3);
        background: linear-gradient(180deg, #1e2328 0%, #111318 100%);
        border-radius: 2px;
        font-weight: bold;
        user-select: none;
        touch-action: none
      }

      .cell-coin {
        color: #ffeb7b;
        font-weight: bold
      }

      .chk-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        width: 100%;
        height: 100%
      }

      @keyframes breathing {
        0% {
          box-shadow: 0 0 2px var(--lol-hextech-glow);
          border-color: var(--lol-gold-3);
          transform: scale(1)
        }

        50% {
          box-shadow: 0 0 12px var(--lol-hextech-blue);
          border-color: var(--lol-hextech-blue);
          transform: scale(1.08)
        }

        100% {
          box-shadow: 0 0 2px var(--lol-hextech-glow);
          border-color: var(--lol-gold-3);
          transform: scale(1)
        }
      }

      input[type=checkbox] {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid var(--lol-gold-3);
        background: rgba(5, 3, 10, .8);
        cursor: pointer;
        position: relative;
        transition: all .2s ease;
        border-radius: 2px;
        flex-shrink: 0
      }

      input[type=checkbox].breathing {
        animation: breathing 1.8s infinite ease-in-out
      }

      input[type=checkbox]:checked {
        border-color: var(--lol-hextech-blue);
        background: rgba(10, 200, 185, .2);
        box-shadow: 0 0 8px var(--lol-hextech-glow)
      }

      input[type=checkbox]:checked::after {
        content: '◆';
        font-size: 10px;
        color: var(--lol-hextech-blue);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-shadow: 0 0 5px var(--lol-hextech-blue)
      }

      .timer-label {
        font-size: 11px;
        color: #888;
        font-family: monospace;
        letter-spacing: 1px;
        line-height: 1
      }

      .countdown-running {
        color: var(--lol-red);
        font-weight: bold;
        text-shadow: 0 0 6px rgba(232, 64, 87, .6)
      }

      .countdown-done {
        color: var(--lol-hextech-blue);
        font-weight: bold;
        text-shadow: 0 0 6px var(--lol-hextech-glow)
      }

      .hide-control-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px
      }

      .btn-restore-all {
        padding: 2px 8px;
        font-size: 11px;
        border-color: var(--lol-gold-3);
        color: var(--lol-gold-2);
        background: rgba(10, 8, 20, .9)
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 3, 10, .35);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999
      }

      .modal-box {
        background: rgba(18, 13, 33, .85);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1.5px solid rgba(200, 170, 110, .6);
        border-radius: 6px;
        padding: 25px;
        width: 320px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, .6), inset 0 0 20px rgba(147, 51, 234, .2)
      }

      .modal-title {
        font-family: 'Cinzel', 'Noto Sans TC', serif;
        font-size: 18px;
        color: var(--lol-gold-1);
        margin-bottom: 15px;
        letter-spacing: 1px
      }

      .modal-content {
        font-size: 15px;
        color: var(--lol-gold-2);
        margin-bottom: 25px;
        word-break: break-all
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        justify-content: center
      }

      .modal-btn-cancel,
      .modal-btn-confirm {
        flex: 1
      }

      #copyToast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(15, 11, 25, .95);
        color: var(--lol-gold-1);
        border: 1px solid var(--lol-gold-2);
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: all .3s ease;
        z-index: 10000;
        text-align: center;
        max-width: 80vw;
        width: max-content;
        white-space: normal;
        word-break: break-word;
        font-size: 13px
      }

      #copyToast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0)
      }

      .admin-only {
        display: none !important
      }

      .user-only {
        display: table-cell
      }

      @supports (-webkit-touch-callout:none) {

        html,
        body {
          width: 100%;
          max-width: 100vw;
          min-width: 0;
          overflow-x: hidden !important
        }

        .table-responsive {
          width: 100%;
          max-width: 100vw;
          min-width: 0;
          overflow-x: auto !important;
          overflow-y: visible
        }
      }

      @media (min-width:576px) {
        .header-container {
          flex-direction: row;
          justify-content: space-between;
          align-items: center
        }

        h2 {
          text-align: left
        }

        .login-box {
          width: auto;
          flex-direction: row
        }

        .login-box input {
          width: 110px;
          flex: none
        }

        .btn-add,
        .btn-unlock,
        .btn-reset,
        .btn-save,
        .btn-load {
          flex: none
        }

        .user-status {
          width: auto;
          justify-content: flex-start
        }
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <h2>j808 管理控制台</h2>
      <div class="login-box" id="loginBox">
        <div id="loginForm" class="login-form-inner">
          <input type="text" id="customUser" placeholder="帳號">
          <input type="password" id="customPass" placeholder="密碼">
          <button class="btn-login" onclick="handleLogin()">管理員登入</button>
        </div>
        <div id="userInfo" class="user-status" style="display:none"><span>✦ 管理員權限已驗證</span><button onclick="handleLogout()" style="padding:4px 10px;font-size:12px">登出</button></div>
      </div>
    </div>
    <div class="btn-container">
      <button class="btn-add admin-only" onclick="addRow()">+ 新增紀錄</button>
      <button class="btn-unlock admin-only" id="unlockBtn" onclick="toggleUnlock()">解除鎖定</button>
      <button class="btn-reset admin-only" onclick="resetCheckboxes()">重置勾選框</button>
      <button class="btn-save admin-only" onclick="confirmSaveToGitHub()">保存雲端 (GitHub)</button>
      <button class="btn-load admin-only" onclick="confirmLoadFromGitHub()">讀取雲端 (GitHub)</button>
    </div>

    <div class="table-responsive" id="tableResponsive">
      <div class="table-scroll-lock">
        <table id="dataTable" class="collapsed-r collapsed-f">
          <thead>
            <tr>
              <th>編號</th>
              <th>等級</th>
              <th class="toggle-trigger" onclick="toggleNameColumns(event)">名稱</th>
              <th class="col-collapsible-r">領1</th>
              <th class="col-collapsible-r">領2</th>
              <th class="col-collapsible-r">領3</th>
              <th class="col-collapsible-r">領4</th>
              <th class="col-collapsible-r">領5</th>
              <th class="toggle-trigger" onclick="toggleCoinColumns(event)">幣量</th>
              <th class="col-collapsible-f">好友1</th>
              <th class="col-collapsible-f">好友2</th>
              <th class="col-collapsible-f">好友3</th>
              <th class="col-collapsible-f">好友4</th>
              <th class="col-collapsible-f">好友5</th>
              <th class="col-collapsible-f col-phone-th">電話</th>
              <th class="user-only">
                <div class="hide-control-header"><button class="btn-restore-all" onclick="restoreAllHiddenRows()">恢復</button></div>
              </th>
              <th class="admin-only">操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
      <div class="modal-box">
        <div class="modal-title" id="modalTitle">確認刪除</div>
        <div class="modal-content" id="modalText">確定要刪除嗎？</div>
        <div class="modal-buttons"><button class="modal-btn-cancel" onclick="closeConfirmModal()">取消</button><button class="modal-btn-confirm" id="modalConfirmBtn">刪除</button></div>
      </div>
    </div>
    <div id="copyToast">已複製內容</div>

    <script>
      const T_PART1 = "2ajJg1LkRQh0Cz",
        T_PART2 = "twHr9WgAby6rM6",
        T_PART3 = "EY1ywTH9";
      const G_ID = "a3f8fa6f452b98b777440a5c0558c190";
      const _0x112a = "ajgwOA==",
        _0x889f = "ajEwMg==";
      let rowCounter = 0,
        isAdmin = false,
        isUnlocked = false,
        pendingDeleteId = null;
      const timers = {},
        endTimes = {};
      const LOCAL_STATE_KEY = 'j808_user_timers',
        LOCAL_DATA_KEY = 'j808_local_table_data',
        LOCAL_HIDDEN_KEY = 'j808_hidden_rows_state',
        LOCAL_COL_R_STATE_KEY = 'j808_columns_collapsed_r',
        LOCAL_COL_F_STATE_KEY = 'j808_columns_collapsed_f',
        LOCAL_NAME_CHK_KEY = 'j808_name_checkbox_states';
      let lastClickTime = 0,
        columnToggleLock = false,
        columnLayoutRaf = 0;

      function preventDoubleTapZoom(e) { const n = Date.now(),
          d = n - lastClickTime; if (d < 300 && d > 0) e.preventDefault();
        lastClickTime = n }

      function debounce(fn, wait) { let t; return function(...a) { clearTimeout(t);
          t = setTimeout(() => fn.apply(this, a), wait) } }
      const debouncedSaveTableToLocal = debounce(saveTableToLocal, 400);

      function _getD(s) { return atob(s) }

      function _getK() { return "ghp_" + T_PART1 + T_PART2 + T_PART3 }

      function clearAllActiveTimers() { Object.values(timers).forEach(x => x && x.interval && clearInterval(x.interval));
        Object.keys(timers).forEach(k => delete timers[k]);
        Object.keys(endTimes).forEach(k => delete endTimes[k]) }

      function getLocalStates() { try { return JSON.parse(localStorage.getItem(LOCAL_STATE_KEY)) || {} } catch (e) { return {} } }

      function saveLocalState(k, c, t) { const d = getLocalStates(); if (c) d[k] = { checked: true, endTime: t };
        else delete d[k];
        localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(d)) }

      function clearAllLocalTimers() { localStorage.removeItem(LOCAL_STATE_KEY) }

      function getNameChkStates() { try { return JSON.parse(localStorage.getItem(LOCAL_NAME_CHK_KEY)) || {} } catch (e) { return {} } }

      function saveNameChkState(uid, c) { const d = getNameChkStates(); if (c) d[uid] = true;
        else delete d[uid];
        localStorage.setItem(LOCAL_NAME_CHK_KEY, JSON.stringify(d)) }

      function getHiddenRowsState() { try { return JSON.parse(localStorage.getItem(LOCAL_HIDDEN_KEY)) || {} } catch (e) { return {} } }

      function saveHiddenRowState(uid, h) { const d = getHiddenRowsState(); if (h) d[uid] = true;
        else delete d[uid];
        localStorage.setItem(LOCAL_HIDDEN_KEY, JSON.stringify(d)) }

      function initColumnState() {
        const t = dataTable;
        const r = localStorage.getItem(LOCAL_COL_R_STATE_KEY),
          f = localStorage.getItem(LOCAL_COL_F_STATE_KEY);
        t.classList.toggle('collapsed-r', r === null || r === 'true');
        t.classList.toggle('collapsed-f', f === null || f === 'true');
        if (r === null) localStorage.setItem(LOCAL_COL_R_STATE_KEY, 'true');
        if (f === null) localStorage.setItem(LOCAL_COL_F_STATE_KEY, 'true');
      }
      /* 核心：切換時保留水平/垂直位置，並把 layout 更新限制在 requestAnimationFrame */
      function performColumnToggle(cls, key, msg) {
        if (columnToggleLock) return;
        columnToggleLock = true;
        const wrap = document.getElementById('tableResponsive'),
          t = document.getElementById('dataTable');
        const oldX = wrap.scrollLeft,
          oldY = window.scrollY;
        const collapsed = t.classList.contains(cls);
        t.classList.toggle(cls, !collapsed);
        localStorage.setItem(key, !collapsed ? 'true' : 'false');
        if (columnLayoutRaf) cancelAnimationFrame(columnLayoutRaf);
        columnLayoutRaf = requestAnimationFrame(() => {
          const maxX = Math.max(0, wrap.scrollWidth - wrap.clientWidth);
          wrap.scrollLeft = Math.min(oldX, maxX);
          window.scrollTo(0, oldY);
          columnLayoutRaf = requestAnimationFrame(() => {
            const maxX2 = Math.max(0, wrap.scrollWidth - wrap.clientWidth);
            if (Math.abs(wrap.scrollLeft - oldX) > 1) wrap.scrollLeft = Math.min(oldX, maxX2);
            window.scrollTo(0, oldY);
            columnToggleLock = false;
            columnLayoutRaf = 0;
          });
        });
        showToast(msg);
      }

      function toggleNameColumns(e) { if (e) { e.preventDefault();
          preventDoubleTapZoom(e) } const t = dataTable;
        performColumnToggle('collapsed-r', LOCAL_COL_R_STATE_KEY, t.classList.contains('collapsed-r') ? '已展開 領1~5 欄位' : '已收合 領1~5 欄位') }

      function toggleCoinColumns(e) { if (e) { e.preventDefault();
          preventDoubleTapZoom(e) } const t = dataTable;
        performColumnToggle('collapsed-f', LOCAL_COL_F_STATE_KEY, t.classList.contains('collapsed-f') ? '已展開好友與電話欄位' : '已收合好友與電話欄位') }

      function showConfirmModal(title, text, confirmText, isDanger = false, onConfirm = () => {}) {
        modalTitle.innerText = title;
        modalText.innerText = text;
        const b = modalConfirmBtn;
        b.innerText = confirmText;
        b.className = 'modal-btn-confirm';
        if (!isDanger) { b.style.borderColor = 'var(--lol-hextech-blue)';
          b.style.color = 'var(--lol-hextech-blue)';
          b.style.background = 'linear-gradient(180deg,rgba(9,40,48,.9) 0%,rgba(3,16,21,.9) 100%)' } else b.removeAttribute('style');
        b.onclick = () => { onConfirm();
          closeConfirmModal() };
        confirmModal.style.display = 'flex'
      }

      function closeConfirmModal() { confirmModal.style.display = 'none';
        pendingDeleteId = null }
      let toastTimer = null;

      function showToast(m) { copyToast.innerText = m;
        copyToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => copyToast.classList.remove('show'), 1800) }

      function saveTableToLocal() { const d = getTableData(); if (!d.length) localStorage.removeItem(LOCAL_DATA_KEY);
        else localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(d)) }

      function restoreAllHiddenRows() { localStorage.removeItem(LOCAL_HIDDEN_KEY);
        document.querySelectorAll('#tableBody tr').forEach(r => { r.classList.remove('row-hidden'); const c = r.querySelector('.chk-hide-row'); if (c) c.checked = false });
        showToast('已全部恢復顯示') }
      window.addEventListener('DOMContentLoaded', () => {
        initColumnState();
        if (localStorage.getItem('j808_is_admin') === 'true') setAdminMode(true);
        reloadTableFromLocal();
      });
      window.addEventListener('storage', e => {
        if ([LOCAL_STATE_KEY, LOCAL_DATA_KEY, LOCAL_NAME_CHK_KEY, LOCAL_HIDDEN_KEY].includes(e.key)) reloadTableFromLocal();
      });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) document.querySelectorAll('.chk-receive:checked').forEach(c => { const k = `${c.dataset.uid}_${c.dataset.idx}`; if (endTimes[k]) initTimerWithEndTime(c, endTimes[k]) }) });

      function handleLogin() { if (customUser.value === _getD(_0x112a) && customPass.value === _getD(_0x889f)) { localStorage.setItem('j808_is_admin', 'true');
          setAdminMode(true);
          reloadTableFromLocal();
          showToast('管理員登入成功') } else showToast('帳號或密碼錯誤！') }

      function handleLogout() { localStorage.removeItem('j808_is_admin');
        setAdminMode(false);
        reloadTableFromLocal();
        showToast('已登出管理員') }

      function reloadTableFromLocal() { try { clearAllActiveTimers();
          tableBody.innerHTML = '';
          rowCounter = 0; const s = localStorage.getItem(LOCAL_DATA_KEY); if (s) { const d = JSON.parse(s); if (Array.isArray(d)) d.forEach(x => addRow(x, true)) } } catch (e) { console.error(e) } }

      function setAdminMode(s) { isAdmin = s;
        isUnlocked = false;
        updateUnlockUI();
        document.querySelectorAll('.admin-only').forEach(x => x.style.setProperty('display', s ? 'block' : 'none', 'important'));
        document.querySelectorAll('.user-only').forEach(x => x.style.setProperty('display', s ? 'none' : 'table-cell', 'important'));
        document.querySelectorAll('th.admin-only').forEach(x => x.style.setProperty('display', s ? 'table-cell' : 'none', 'important'));
        loginForm.style.setProperty('display', s ? 'none' : 'flex', 'important');
        userInfo.style.setProperty('display', s ? 'flex' : 'none', 'important'); if (!s) { customUser.value = '';
          customPass.value = '' } updateInputsState() }

      function toggleUnlock() { if (!isAdmin) return;
        isUnlocked = !isUnlocked;
        updateUnlockUI();
        updateInputsState() }

      function updateUnlockUI() { unlockBtn.innerText = isUnlocked ? '已解除鎖定' : '解除鎖定';
        unlockBtn.classList.toggle('unlocked', isUnlocked) }

      function updateInputsState() { document.querySelectorAll('#tableBody input[type=text]').forEach(i => i.readOnly = !(isAdmin && isUnlocked)) }

      function addRow(data = {}, isInitializing = false) {
        rowCounter++;
        const uid = data.uid || ('row_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
          tr = document.createElement('tr');
        tr.id = 'row-' + rowCounter;
        tr.dataset.uid = uid;
        const hidden = getHiddenRowsState();
        if (hidden[uid]) tr.classList.add('row-hidden');
        const states = getLocalStates();
        let rhtml = '';
        for (let i = 1; i <= 5; i++) { const k = `${uid}_${i}`,
            l = states[k],
            checked = l !== undefined ? l.checked : !!data[`r${i}`];
          rhtml += `<td class="col-collapsible-r"><div class="chk-container"><input type="checkbox" class="chk-receive" data-uid="${uid}" data-idx="${i}" ${checked?'checked':''} onchange="toggleTimer(this)"><div class="timer-label" id="timer-${uid}-${i}">00:00</div></div></td>` }
        const ns = getNameChkStates(),
          nameChecked = ns[uid] !== undefined ? ns[uid] : !!data.nameChk,
          ro = isAdmin && isUnlocked ? '' : 'readonly';
        const user = `<td class="user-only" style="${isAdmin?'display:none!important':''}"><div class="chk-container"><input type="checkbox" class="chk-hide-row" data-uid="${uid}" ${hidden[uid]?'checked':''} onchange="toggleHideRow(this)"></div></td>`;
        const action = isAdmin ? `<td><div class="action-buttons-group"><button onclick="confirmDelete('${uid}')" style="color:var(--lol-red);border-color:var(--lol-red);padding:4px 10px">刪除</button><span class="drag-handle">≡</span></div></td>` : `<td class="admin-only"></td>`;
        tr.innerHTML = `<td><input type="text" class="cell-no" value="${data.no||rowCounter}" ${ro}></td><td><input type="text" class="cell-level" value="${data.level||''}" ${ro}></td><td><div class="name-cell-container"><input type="checkbox" class="chk-name-prefix" data-uid="${uid}" ${nameChecked?'checked':''} onchange="saveNameCheckboxState(this)"><input type="text" class="cell-name" value="${data.name||''}" ${ro}></div></td>${rhtml}<td><input type="text" class="cell-coin" value="${data.coin||''}" ${ro}></td><td class="col-collapsible-f"><input type="text" class="cell-f1" value="${data.f1||''}" ${ro}></td><td class="col-collapsible-f"><input type="text" class="cell-f2" value="${data.f2||''}" ${ro}></td><td class="col-collapsible-f"><input type="text" class="cell-f3" value="${data.f3||''}" ${ro}></td><td class="col-collapsible-f"><input type="text" class="cell-f4" value="${data.f4||''}" ${ro}></td><td class="col-collapsible-f"><input type="text" class="cell-f5" value="${data.f5||''}" ${ro}></td><td class="col-collapsible-f col-phone-td"><input type="text" class="cell-phone" value="${data.phone||''}" ${ro}></td>${user}${action}`;
        tableBody.appendChild(tr);
        const handle = tr.querySelector('.drag-handle');
        if (handle) bindDragAndDropEvents(tr, handle);
        tr.querySelectorAll('input[type=text]').forEach(i => { i.addEventListener('input', debouncedSaveTableToLocal);
          i.addEventListener('click', () => { if (i.readOnly && i.value) fallbackCopyText(i.value.trim()) }) });
        for (let i = 1; i <= 5; i++) { const k = `${uid}_${i}`,
            c = tr.querySelector(`.chk-receive[data-idx="${i}"]`),
            l = states[k],
            end = l?.endTime || data[`r${i}_time`]; if (c.checked) initTimerWithEndTime(c, end || Date.now() + 600000) }
        if (!isInitializing) saveTableToLocal()
      }

      function saveNameCheckboxState(c) { saveNameChkState(c.dataset.uid, c.checked);
        saveTableToLocal() }

      function toggleHideRow(c) { const r = document.querySelector(`tr[data-uid="${c.dataset.uid}"]`); if (!r) return;
        r.classList.toggle('row-hidden', c.checked);
        saveHiddenRowState(c.dataset.uid, c.checked) }

      function bindDragAndDropEvents(tr, h) {
        let dragging = false,
          raf = 0;
        h.addEventListener('mousedown', e => { if (!isAdmin) return;
          dragging = true;
          tr.classList.add('dragging');
          e.preventDefault();
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up) });

        function move(e) { if (!dragging) return;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { const rows = [...tableBody.querySelectorAll('tr')],
              target = rows.find(r => { const b = r.getBoundingClientRect(); return e.clientY >= b.top && e.clientY <= b.bottom }); if (target && target !== tr) { const b = target.getBoundingClientRect();
              tableBody.insertBefore(tr, e.clientY < b.top + b.height / 2 ? target : target.nextSibling) } }) }

        function up() { if (!dragging) return;
          dragging = false;
          cancelAnimationFrame(raf);
          tr.classList.remove('dragging');
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          saveTableToLocal();
          showToast('排序已更新') }
        h.addEventListener('touchstart', () => { if (isAdmin) { dragging = true;
            tr.classList.add('dragging') } }, { passive: true });
        h.addEventListener('touchmove', e => { if (!dragging) return;
          e.preventDefault(); const y = e.touches[0].clientY;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { const target = [...tableBody.querySelectorAll('tr')].find(r => { const b = r.getBoundingClientRect(); return y >= b.top && y <= b.bottom }); if (target && target !== tr) { const b = target.getBoundingClientRect();
              tableBody.insertBefore(tr, y < b.top + b.height / 2 ? target : target.nextSibling) } }) }, { passive: false });
        h.addEventListener('touchend', up)
      }
      let sharedTextarea = null;
      async function fallbackCopyText(t) { try { await navigator.clipboard.writeText(t);
          showToast(`已複製：${t}`); return } catch (e) {} try { if (!sharedTextarea) { sharedTextarea = document.createElement('textarea');
            sharedTextarea.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
            document.body.appendChild(sharedTextarea) } sharedTextarea.value = t;
          sharedTextarea.focus();
          sharedTextarea.select();
          document.execCommand('copy');
          showToast(`已複製：${t}`) } catch (e) { showToast('複製失敗，請手動複製') } }

      function initTimerWithEndTime(c, end) { const k = `${c.dataset.uid}_${c.dataset.idx}`,
          label = document.getElementById(`timer-${c.dataset.uid}-${c.dataset.idx}`); if (!label) return; if (timers[k]) clearInterval(timers[k].interval); if (!end) { label.innerText = '00:00'; return } const update = () => { const s = Math.floor((end - Date.now()) / 1000); if (s <= 0) { clearInterval(timers[k]);
            delete timers[k];
            label.innerText = '00:00';
            label.className = 'timer-label countdown-done';
            c.classList.remove('breathing') } else { label.className = 'timer-label countdown-running';
            label.innerText = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            c.classList.add('breathing') } };
        update();
        timers[k] = { interval: setInterval(update, 1000) };
        endTimes[k] = end }

      function toggleTimer(c) { const k = `${c.dataset.uid}_${c.dataset.idx}`,
          label = document.getElementById(`timer-${c.dataset.uid}-${c.dataset.idx}`); if (c.checked) { const end = Date.now() + 600000;
          saveLocalState(k, true, end);
          initTimerWithEndTime(c, end) } else { if (timers[k]) clearInterval(timers[k].interval);
          delete timers[k];
          delete endTimes[k];
          label.innerText = '00:00';
          label.className = 'timer-label';
          c.classList.remove('breathing');
          saveLocalState(k, false, 0) } saveTableToLocal() }

      function confirmDelete(uid) { if (!isAdmin) return;
        pendingDeleteId = uid; const r = document.querySelector(`tr[data-uid="${uid}"]`),
          n = r?.querySelector('.cell-name')?.value.trim();
        showConfirmModal('確認刪除', `確定要刪除 ${n?'「'+n+'」':'此筆紀錄'} 嗎？`, '刪除', true, () => executeDelete(uid)) }

      function executeDelete(uid) { const r = document.querySelector(`tr[data-uid="${uid}"]`); if (!r) return; for (let i = 1; i <= 5; i++) { const k = `${uid}_${i}`; if (timers[k]) clearInterval(timers[k].interval);
          delete timers[k];
          delete endTimes[k];
          saveLocalState(k, false, 0) } saveHiddenRowState(uid, false); const ns = getNameChkStates();
        delete ns[uid];
        localStorage.setItem(LOCAL_NAME_CHK_KEY, JSON.stringify(ns));
        r.remove();
        saveTableToLocal();
        showToast('已刪除紀錄') }

      function resetCheckboxes() { if (!isAdmin) return;
        clearAllLocalTimers();
        localStorage.removeItem(LOCAL_NAME_CHK_KEY);
        document.querySelectorAll('.chk-receive').forEach(c => { c.checked = false;
          toggleTimer(c) });
        document.querySelectorAll('.chk-name-prefix').forEach(c => c.checked = false);
        saveTableToLocal();
        showToast('已重置所有勾選框與倒數計時！') }

      function getTableData() { return [...document.querySelectorAll('#tableBody tr')].map(r => { const uid = r.dataset.uid,
            ch = [...r.querySelectorAll('.chk-receive')],
            g = s => r.querySelector(s)?.value || '',
            d = { uid, no: g('.cell-no'), level: g('.cell-level'), nameChk: r.querySelector('.chk-name-prefix')?.checked || false, name: g('.cell-name'), coin: g('.cell-coin'), f1: g('.cell-f1'), f2: g('.cell-f2'), f3: g('.cell-f3'), f4: g('.cell-f4'), f5: g('.cell-f5'), phone: g('.cell-phone') }; for (let i = 1; i <= 5; i++) { const k = `${uid}_${i}`;
            d[`r${i}`] = ch[i - 1].checked;
            d[`r${i}_time`] = ch[i - 1].checked ? (endTimes[k] || getLocalStates()[k]?.endTime || 0) : 0 } return d }) }

      function confirmSaveToGitHub() { if (!isAdmin) return showToast('請先登入管理員權限！');
        showConfirmModal('確認保存', '確定要將目前資料保存至雲端 (GitHub) 嗎？', '保存', false, executeSaveToGitHub) }

      function confirmLoadFromGitHub() { if (!isAdmin) return showToast('請先登入管理員權限！');
        showConfirmModal('確認讀取', '確定要從雲端 (GitHub) 讀取資料嗎？（這將會覆寫目前的本地資料）', '讀取', false, executeLoadFromGitHub) }
      let isSavingToCloud = false;
      async function executeSaveToGitHub() { if (!isAdmin || isSavingToCloud) return;
        isSavingToCloud = true; try { const r = await fetch(`https://api.github.com/gists/${G_ID}`, { method: 'PATCH', headers: { Authorization: `Bearer ${_getK()}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ description: 'Grid Data Storage with Timers', files: { 'grid_data.json': { content: JSON.stringify(getTableData(), null, 2) } } }) });
          showToast(r.ok ? '管理員修改成功，已成功保存至雲端！' : `保存失敗：狀態碼 ${r.status}`) } catch (e) { showToast('網路連線失敗，請檢查網路狀態。') } finally { isSavingToCloud = false } }
      async function executeLoadFromGitHub() { try { const r = await fetch(`https://api.github.com/gists/${G_ID}`, { headers: { Authorization: `Bearer ${_getK()}`, Accept: 'application/vnd.github.v3+json' } }); if (!r.ok) return showToast(`讀取失敗：狀態碼 ${r.status}`); const j = await r.json(),
            d = JSON.parse(j.files['grid_data.json'].content);
          clearAllActiveTimers();
          clearAllLocalTimers(); const ns = {},
            ls = {};
          d.forEach(x => { if (x.nameChk) ns[x.uid] = true; for (let i = 1; i <= 5; i++)
              if (x[`r${i}`] && x[`r${i}_time`]) ls[`${x.uid}_${i}`] = { checked: true, endTime: x[`r${i}_time`] } });
          localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(ls));
          localStorage.setItem(LOCAL_NAME_CHK_KEY, JSON.stringify(ns));
          localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(d));
          reloadTableFromLocal();
          showToast('成功從雲端讀取資料並同步至本地！') } catch (e) { showToast('網路連線失敗，請檢查網路狀態。') } }
    </script>
  </body>
</html>

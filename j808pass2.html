<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>j 808 pass</title>
    <style>
      :root {
        --oni-red: #ff2222;
        --oni-red-glow: rgba(255, 34, 34, 0.4);
        --oni-gold: #ffb700;
        --oni-gold-glow: rgba(255, 183, 0, 0.4);
        --oni-bg: #090303;
        --oni-card: rgba(18, 8, 8, 0.95);
        --oni-border: rgba(255, 34, 34, 0.4);
        --text-bright: #fff3f3;
        --text-dim: #ff9999;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body,
      html {
        width: 100%;
        min-height: 100%;
        background-color: var(--oni-bg);
        color: var(--text-bright);
        overflow-x: hidden;
      }

      /* 結界背景與護摩灰燼特效 (放最底層) */
      .ar-viewport {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background: radial-gradient(circle at center, #2b0606 0%, #090303 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 20px;
        z-index: 1;
      }

      .camera-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 34, 34, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 34, 34, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      /* 中央結界法陣面板：提升 z-index，完全壓在背景光條之上 */
      .holo-panel {
        position: relative;
        width: 100%;
        max-width: 650px;
        background: var(--oni-card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 4px;
        padding: 28px;
        box-shadow:
          0 0 35px var(--oni-red-glow),
          inset 0 0 20px rgba(255, 34, 34, 0.15);
        z-index: 10;
        border: 1px solid var(--oni-border);
      }

      /* 背景斜向護摩神焰光條容器：改為絕對定位在 ar-viewport 內部，且 z-index 設在面板下方 (z-index: 2) */
      .cyber-matrix-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        overflow: hidden;
      }

      .diagonal-beam {
        position: absolute;
        width: 150vw;
        height: 6px;
        background: linear-gradient(90deg, transparent, var(--oni-red), var(--oni-gold), var(--oni-red), transparent);
        box-shadow: 0 0 20px var(--oni-red), 0 0 35px var(--oni-gold);
        opacity: 0;
      }

      .beam-tl-br {
        top: -20vh;
        left: -50vw;
        transform: rotate(45deg);
        animation: moveTlBr 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        animation-delay: 0s;
      }

      .beam-tr-bl {
        top: -20vh;
        right: -50vw;
        transform: rotate(135deg);
        animation: moveTrBl 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        animation-delay: 2.5s;
      }

      .beam-br-tl {
        bottom: -20vh;
        right: -50vw;
        transform: rotate(225deg);
        animation: moveBrTl 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        animation-delay: 5s;
      }

      .beam-bl-tr {
        bottom: -20vh;
        left: -50vw;
        transform: rotate(315deg);
        animation: moveBlTr 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        animation-delay: 7.5s;
      }

      @keyframes moveTlBr {
        0% { transform: translate(-20vw, -20vh) rotate(45deg); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translate(120vw, 120vh) rotate(45deg); opacity: 0; }
      }

      @keyframes moveTrBl {
        0% { transform: translate(20vw, -20vh) rotate(135deg); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translate(-120vw, 120vh) rotate(135deg); opacity: 0; }
      }

      @keyframes moveBrTl {
        0% { transform: translate(20vw, 20vh) rotate(225deg); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translate(-120vw, -120vh) rotate(225deg); opacity: 0; }
      }

      @keyframes moveBlTr {
        0% { transform: translate(-20vw, 20vh) rotate(315deg); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translate(120vw, -120vh) rotate(315deg); opacity: 0; }
      }

      /* 金剛咒印邊框跑光線 SVG 層 */
      .rog-border-glow {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 4px;
        pointer-events: none;
        overflow: visible;
        z-index: 5;
      }

      .rog-border-glow rect {
        width: 100%;
        height: 100%;
        rx: 4px;
        ry: 4px;
        fill: none;
        stroke: url(#rog-gradient);
        stroke-width: 2.5;
        stroke-dasharray: 120 1800;
        stroke-dashoffset: 1920;
        animation: rogRun 4s linear infinite;
        filter: drop-shadow(0 0 6px var(--oni-red));
      }

      @keyframes rogRun {
        0% { stroke-dashoffset: 1920; }
        100% { stroke-dashoffset: 0; }
      }

      .holo-panel .panel-header,
      .holo-panel .ar-rules,
      .holo-panel .form-grid,
      .holo-panel .ar-result-display,
      .holo-panel .corner-deco-tl,
      .holo-panel .corner-deco-br {
        position: relative;
        z-index: 6;
      }

      .holo-panel .corner-deco-tl,
      .holo-panel .corner-deco-br {
        position: absolute;
        width: 16px;
        height: 16px;
        border-color: var(--oni-gold);
        border-style: solid;
        pointer-events: none;
      }

      .holo-panel .corner-deco-tl {
        top: 0;
        left: 0;
        border-width: 4px 0 0 4px;
      }

      .holo-panel .corner-deco-br {
        bottom: 0;
        right: 0;
        border-width: 0 4px 4px 0;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--oni-border);
        padding-bottom: 12px;
        margin-bottom: 20px;
      }

      .panel-title {
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: var(--text-bright);
        text-shadow: 0 0 10px var(--oni-red);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status-tag {
        font-size: 0.75rem;
        padding: 3px 8px;
        background: rgba(255, 34, 34, 0.15);
        border: 1px solid var(--oni-red);
        border-radius: 2px;
        color: var(--oni-gold);
        letter-spacing: 1px;
        font-weight: bold;
      }

      .ar-rules {
        font-size: 0.825rem;
        color: var(--text-dim);
        background: rgba(255, 34, 34, 0.05);
        border-left: 3px solid var(--oni-red);
        padding: 12px 16px;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .ar-rules ul {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px 12px;
        margin-top: 6px;
        list-style: none;
      }

      .ar-rules li::before {
        content: "🔥 ";
        color: var(--oni-gold);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .input-group label {
        font-size: 0.8rem;
        color: var(--text-dim);
        letter-spacing: 0.5px;
      }

      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-wrapper input {
        width: 100%;
        background: rgba(25, 10, 10, 0.9);
        border: 1px solid var(--oni-border);
        border-radius: 4px;
        padding: 10px 12px;
        color: var(--text-bright);
        font-size: 1rem;
        font-weight: 600;
        outline: none;
        transition: all 0.2s;
      }

      .input-wrapper input:focus {
        border-color: var(--oni-gold);
        box-shadow: 0 0 10px var(--oni-gold-glow);
      }

      .input-unit {
        position: absolute;
        right: 12px;
        font-size: 0.75rem;
        color: var(--text-dim);
        pointer-events: none;
      }

      .ar-result-display {
        background: rgba(12, 4, 4, 0.95);
        border: 1px solid var(--oni-border);
        border-radius: 4px;
        padding: 20px;
      }

      .result-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .result-label {
        font-size: 0.85rem;
        color: var(--text-dim);
        letter-spacing: 1px;
      }

      .level-text {
        font-size: 2.2rem;
        font-weight: 800;
        color: var(--oni-gold);
        text-shadow: 0 0 12px var(--oni-gold-glow);
      }

      .ar-progress-outer {
        height: 10px;
        background: rgba(255, 34, 34, 0.15);
        border: 1px solid var(--oni-border);
        border-radius: 2px;
        padding: 2px;
        margin-bottom: 16px;
      }

      .ar-progress-inner {
        height: 100%;
        background: linear-gradient(90deg, var(--oni-red), var(--oni-gold));
        border-radius: 1px;
        width: 0%;
        box-shadow: 0 0 8px var(--oni-red);
        transition: width 0.3s ease-out;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        border-top: 1px dashed var(--oni-border);
        padding-top: 14px;
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .stat-card .lbl {
        font-size: 0.75rem;
        color: var(--text-dim);
      }

      .stat-card .val {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-bright);
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 480px) {
        .form-grid,
        .stats-row,
        .ar-rules ul {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>

    <div class="ar-viewport">
      <div class="camera-grid"></div>

      <!-- 背景斜向護摩神焰光條 -->
      <div class="cyber-matrix-container">
        <div class="diagonal-beam beam-tl-br"></div>
        <div class="diagonal-beam beam-tr-bl"></div>
        <div class="diagonal-beam beam-br-tl"></div>
        <div class="diagonal-beam beam-bl-tr"></div>
      </div>

      <!-- 中央結界法陣面板 -->
      <div class="holo-panel">
        <svg class="rog-border-glow">
          <defs>
            <linearGradient id="rog-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--oni-gold)" />
              <stop offset="100%" stop-color="var(--oni-red)" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="100%" height="100%" />
        </svg>

        <div class="corner-deco-tl"></div>
        <div class="corner-deco-br"></div>

        <div class="panel-header">
          <div class="panel-title">
            <span>👹</span>j 808通行證預測
          </div>
          <div class="status-tag">jimi102</div>
        </div>

        <div class="ar-rules">
          <strong>[等級需求星數規則]</strong>
          <ul>
            <li>0 ~ 9 級：200 ⭐️ / 級</li>
            <li>9 ~ 19 級：400 ⭐️ / 級</li>
            <li>19 ~ 29 級：600 ⭐️ / 級</li>
            <li>29 ~ 39 級：900 ⭐️ / 級</li>
            <li>40 級以上：1,500 ⭐️ / 級</li>
          </ul>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="currentLevel">當前等級</label>
            <div class="input-wrapper">
              <input type="text" id="currentLevel" value="" oninput="calculate()">
              <span class="input-unit">級</span>
            </div>
          </div>

          <div class="input-group">
            <label for="currentStars">當前已積累 ⭐️</label>
            <div class="input-wrapper">
              <input type="text" id="currentStars" value="" oninput="calculate()">
              <span class="input-unit">⭐️</span>
            </div>
          </div>

          <div class="input-group">
            <label for="days">預測剩餘天數</label>
            <div class="input-wrapper">
              <input type="text" id="days" value="" oninput="calculate()">
              <span class="input-unit">天</span>
            </div>
          </div>

          <div class="input-group">
            <label for="dailyStars">每天基本拿到 ⭐️</label>
            <div class="input-wrapper">
              <input type="text" id="dailyStars" value="300" oninput="calculate()">
              <span class="input-unit">⭐️/天</span>
            </div>
          </div>

          <div class="input-group">
            <label for="dailyBonusStars">每天額外加成 ⭐️</label>
            <div class="input-wrapper">
              <input type="text" id="dailyBonusStars" value="225" oninput="calculate()">
              <span class="input-unit">⭐️/天</span>
            </div>
          </div>

          <div class="input-group">
            <label for="extraSupplyStars">額外一次性補給 ⭐️</label>
            <div class="input-wrapper">
              <input type="text" id="extraSupplyStars" value="" oninput="calculate()">
              <span class="input-unit">⭐️</span>
            </div>
          </div>

          <div class="input-group">
            <label for="targetLevel">理想等級</label>
            <div class="input-wrapper">
              <input type="text" id="targetLevel" value="40" oninput="calculate()">
              <span class="input-unit">級</span>
            </div>
          </div>
        </div>

        <div class="ar-result-display">
          <div class="result-main">
            <span class="result-label">預測可達到等級</span>
            <span class="level-text" id="predictedLevel">Lv. 0</span>
          </div>

          <div class="ar-progress-outer">
            <div class="ar-progress-inner" id="progressBar"></div>
          </div>

          <div class="stats-row">
            <div class="stat-card">
              <span class="lbl">預測總獲得星星</span>
              <span class="val" id="totalStars">0 ⭐️</span>
            </div>
            <div class="stat-card">
              <span class="lbl">每日合計可用</span>
              <span class="val" id="dailyTotal">0 ⭐️/天</span>
            </div>
            <div class="stat-card">
              <span class="lbl">下一級當前進度</span>
              <span class="val" id="nextLevelProgress">0 / 200 ⭐️</span>
            </div>
            <div class="stat-card">
              <span class="lbl">距離下一級還差</span>
              <span class="val" id="neededForNext">200 ⭐️</span>
            </div>
            <div class="stat-card">
              <span class="lbl">與理想等級還要多少</span>
              <span class="val" id="neededForTarget">0 ⭐️</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function getReqStarsForLevel(level) {
        if (level < 9) return 200;
        if (level < 19) return 400;
        if (level < 29) return 600;
        if (level < 39) return 900;
        return 1500;
      }

      function getTotalStarsNeededForTarget(currentLvl, currentStrs, targetLvl) {
        if (targetLvl <= currentLvl) return 0;
        let totalNeeded = 0;
        for (let l = currentLvl; l < targetLvl; l++) {
          let cost = getReqStarsForLevel(l);
          if (l === currentLvl) {
            totalNeeded += Math.max(0, cost - currentStrs);
          } else {
            totalNeeded += cost;
          }
        }
        return totalNeeded;
      }

      function calculate() {
        const currentLevel = Math.max(0, parseInt(document.getElementById('currentLevel').value) || 0);
        const currentStars = Math.max(0, parseInt(document.getElementById('currentStars').value) || 0);
        const days = Math.max(0, parseInt(document.getElementById('days').value) || 0);
        const dailyStars = Math.max(0, parseInt(document.getElementById('dailyStars').value) || 0);
        const dailyBonusStars = Math.max(0, parseInt(document.getElementById('dailyBonusStars').value) || 0);
        const extraSupplyStars = Math.max(0, parseInt(document.getElementById('extraSupplyStars').value) || 0);
        const targetLevel = Math.max(0, parseInt(document.getElementById('targetLevel').value) || 0);

        const dailyPerDay = dailyStars + dailyBonusStars;
        const totalNewStars = (dailyPerDay * days) + extraSupplyStars;
        const totalAvailableStars = currentStars + totalNewStars;

        let level = currentLevel;
        let remainingStars = totalAvailableStars;
        while (true) {
          const cost = getReqStarsForLevel(level);
          if (remainingStars >= cost) {
            remainingStars -= cost;
            level++;
          } else {
            break;
          }
        }

        const nextCost = getReqStarsForLevel(level);
        document.getElementById('totalStars').textContent = totalAvailableStars.toLocaleString() + ' ⭐️';
        document.getElementById('dailyTotal').textContent = dailyPerDay.toLocaleString() + ' ⭐️/天';
        document.getElementById('predictedLevel').textContent = 'Lv. ' + level;
        
        const progressPercent = ((remainingStars / nextCost) * 100).toFixed(1);
        document.getElementById('progressBar').style.width = Math.min(100, progressPercent) + '%';
        document.getElementById('nextLevelProgress').textContent = `${remainingStars.toLocaleString()} / ${nextCost.toLocaleString()} ⭐️ (${progressPercent}%)`;
        document.getElementById('neededForNext').textContent = (nextCost - remainingStars).toLocaleString() + ' ⭐️';

        const totalRequiredForTarget = getTotalStarsNeededForTarget(currentLevel, currentStars, targetLevel);
        const diffStars = totalRequiredForTarget - totalAvailableStars;
        
        const targetElement = document.getElementById('neededForTarget');
        if (diffStars > 0) {
          targetElement.textContent = diffStars.toLocaleString() + ' ⭐️ (還差)';
          targetElement.style.color = 'var(--oni-gold)';
        } else {
          targetElement.textContent = '封印解除 🎉';
          targetElement.style.color = 'var(--oni-gold)';
        }
      }
      calculate();
    </script>

  </body>
</html>

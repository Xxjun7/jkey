<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./Jicon.ico">
    <title>實用小按鈕</title>
  
    <!-- 控制 LINE 預覽顯示的文字 -->
    <meta property="og:title" content="任你打">
    <meta property="og:description" content="常用複製按鈕">
  
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .cafe-hover:hover {
            animation: float 0.6s ease-in-out infinite;
        }
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }
    </style>
</head>
<body id="pageBody" class="bg-[#F4F5FA] text-[#3F3D56] font-sans min-h-screen flex flex-col items-center py-6 px-4 selection:bg-[#D4D1F3] transition-colors duration-300">

    <!-- 主容器：放寬限制 (max-w-2xl)，減少兩側與頂部空隙 -->
    <div id="mainContainer" class="w-full max-w-2xl mx-auto flex flex-col gap-3 transition-all duration-200 relative pt-2">
        
        <!-- 頂部資訊列：將快速排版按鈕與簡潔佈局融合，減少上方空曠感 -->
        <div class="flex items-center justify-between px-2 select-none">
            <div id="formatTrigger" class="text-xs font-medium flex items-center gap-1 cursor-pointer w-fit hover:opacity-85 transition-opacity" onclick="openFormatModal()">
                🎁 快速文字排版
            </div>
        </div>

        <!-- 第一行：功能控制列 -->
        <div id="controlBar1" class="flex items-center justify-between gap-3 p-3 rounded-full shadow-sm border transition-colors duration-300">
            <button onclick="openModal()" id="addBtnStyle" class="flex-1 font-medium py-2.5 px-4 rounded-full shadow-sm transition-all duration-200 active:scale-95 flex items-center justify-center gap-1.5 text-sm cursor-pointer cafe-hover">
                <span class="text-base font-bold">+</span> 新增按鈕
            </button>

            <button id="deleteToggleBtn" onclick="toggleDeleteMode()" class="font-medium py-2.5 px-4 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-sm cursor-pointer border">
                ✨ 編輯模式
            </button>
        </div>

        <!-- 縮放與主題控制列（編輯模式展開時顯示） -->
        <div id="zoomControlBar" class="hidden relative flex items-center justify-between gap-3 p-2 px-4 rounded-full shadow-sm border transition-colors duration-300 animate-in fade-in duration-200">
            <button onclick="adjustZoom(0.1)" id="zoomInBtn" class="flex-1 font-medium py-1.5 px-3 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-xs cursor-pointer flex items-center justify-center gap-1">
                ➕ 放大
            </button>
            <button onclick="adjustZoom(-0.1)" id="zoomOutBtn" class="flex-1 font-medium py-1.5 px-3 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-xs cursor-pointer flex items-center justify-center gap-1">
                ➖ 縮小
            </button>
            
            <button onclick="toggleThemeMenu()" id="themeToggleBarBtn" class="font-medium py-1.5 px-3 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-xs cursor-pointer flex items-center justify-center gap-1" title="切換風格主題">
                🎨 主題
            </button>

            <!-- 風格選擇彈出選單 -->
            <div id="themeMenu" class="hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 w-48 bg-white dark:bg-zinc-900 rounded-2xl shadow-xl border border-black/10 p-2 flex flex-col gap-1.5 backdrop-blur-md z-50">
                <p class="text-[11px] text-zinc-400 px-2 pt-1 font-bold">選擇風格主題：</p>
                <button onclick="setTheme('blueberry')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🫐 藍莓優格</button>
                <button onclick="setTheme('sakura')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🌸 櫻花拿鐵</button>
                <button onclick="setTheme('matcha')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🍵 抹茶拿鐵</button>
                <button onclick="setTheme('mint')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🧊 薄荷藍</button>
                <button onclick="setTheme('sky')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">☁️ 輕柔天空</button>
                <button onclick="setTheme('pudding')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🍮 焦糖布丁</button>
                <button onclick="setTheme('lavender')" class="text-left text-xs px-3 py-2 rounded-xl hover:bg-zinc-100 transition-all flex items-center gap-2 cursor-pointer">🪻 薰衣草紫</button>
            </div>
        </div>

        <!-- 第二行開始：按鈕列表區塊 -->
        <div id="buttonContainer" class="flex flex-col gap-3 pb-12 mt-1"></div>
    </div>

    <!-- 複製成功的小提示 Toast -->
    <div id="toast" class="fixed bottom-6 px-4 py-2 rounded-full text-xs shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        ✨ 複製成功！
    </div>

    <!-- 新增按鈕的彈出小框 -->
    <div id="modal" onclick="handleModalClick(event)" class="fixed inset-0 bg-black/30 backdrop-blur-[2px] hidden items-center justify-center p-4 z-40">
        <div id="modalBox" class="w-full max-w-xs rounded-[2.5rem] p-6 shadow-xl border-2 flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-base">✨ 新增一個小按鈕</h3>
                <button onclick="toggleQuickMenu()" id="quickBtnStyle" class="text-xs font-medium px-3 py-1.5 rounded-full transition-all cursor-pointer">
                    ⚡ 快速按鈕
                </button>
            </div>
            <div id="quickMenu" class="hidden flex flex-col gap-1.5 p-2.5 rounded-2xl border max-h-44 overflow-y-auto transition-colors duration-300">
                <p id="quickDesc" class="text-[11px] px-1 font-medium">點擊下方項目直接加入：</p>
                <button onclick="addQuickText('稍等我一下唷')" class="quick-item text-left text-xs p-2 rounded-xl transition-all cursor-pointer">📌 稍等我一下唷</button>
                <button onclick="addQuickText('1759717138317')" class="quick-item text-left text-xs p-2 rounded-xl transition-all cursor-pointer">📌 1759717138317</button>
                <button onclick="addQuickText('006')" class="quick-item text-left text-xs p-2 rounded-xl transition-all cursor-pointer">📌 006</button>
                <button onclick="addQuickText('點擊選單LINE Pay Money或街口後直接轉帳即可😊')" class="quick-item text-left text-xs p-2 rounded-xl transition-all cursor-pointer">📌 點擊選單LINE Pay Money或街口後直接轉帳即可😊</button>
            </div>
            <input type="text" id="buttonNameInput" placeholder="請輸入按鈕名稱（也是複製的文字）..." 
                class="w-full border-2 focus:outline-none rounded-full px-4 py-3 text-sm transition-all">
            <button onclick="createNewButton()" id="confirmBtnStyle" class="w-full font-medium py-3 rounded-full shadow-md transition-all active:scale-95 cursor-pointer text-white">
                確認新增
            </button>
        </div>
    </div>

    <!-- 🎁 快速排版專屬 UI 面板 -->
    <div id="formatModal" onclick="handleFormatModalClick(event)" class="fixed inset-0 bg-black/30 backdrop-blur-[2px] hidden items-center justify-center p-4 z-40">
        <div id="formatModalBox" class="w-full max-w-md rounded-3xl p-6 shadow-2xl border-2 flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-200 max-h-[90vh] overflow-y-auto">
            <div id="formatHeader" class="flex items-center justify-between border-b pb-3">
                <h3 id="formatModalTitle" class="font-bold text-base flex items-center gap-2">🎁 快速文字排版</h3>
                <div class="flex items-center gap-2">
                    <!-- 重置按鈕：清空 1 與 2 -->
                    <button id="resetBtnStyle" onclick="resetFormatForm()" class="text-xs px-2.5 py-1 rounded-xl cursor-pointer transition-all">🔄 重置</button>
                    <button onclick="closeFormatModal()" class="text-xs opacity-50 hover:opacity-100 px-2 py-1 cursor-pointer">✕ 關閉</button>
                </div>
            </div>

            <!-- 第一行：選單 (選擇即直接加入) -->
            <div class="flex flex-col gap-1.5">
                <label id="label1" class="text-xs font-bold">1. 選擇品項（點擊即可加入，可選多個）：</label>
                <div id="subContainer1" class="border rounded-2xl p-2 flex flex-col gap-1">

                        <option value="" disabled selected>-- 點此選擇品項直接加入 --</option>
                        <optgroup label="💎 會員點數專區">

                            <option value="🪙mycard 170點">🪙mycard 170點</option>
                            <option value="🪙mycard 300點">🪙mycard 300點</option>
                            <option value="🪙mycard 350點">🪙mycard 350點</option>
                            <option value="🪙mycard 400點">🪙mycard 400點</option>
                            <option value="🪙mycard 450點">🪙mycard 450點</option>
                            <option value="🪙mycard 500點">🪙mycard 500點</option>
                            <option value="🪙mycard 750點">🪙mycard 750點</option>
                        </optgroup>
                        <optgroup label="------產包區--------">
                            <option value="🪖神主奧丁 100點">🪖神主奧丁 100點</option>
                            <option value="⚡雷神索爾2  100點">⚡雷神索爾2  100點</option>
                            <option value="🔥火神赫菲斯  100點">🔥火神赫菲斯  100點</option>
                            <option value="🤴戰國霸主  100點">🤴戰國霸主  100點</option>
                            <option value="🦁五獅爆喜  100點">🦁五獅爆喜  100點</option>
                            <option value="🔨雷神索爾  100點">🔨雷神索爾  100點</option>
                            <option value="🐉雙龍秘寶  100點">🐉雙龍秘寶  100點</option>
                            <option value="🧝🏻賽特1000  100點">🧝🏻賽特1000  100點</option>
                            <option value="🐫💰駱馬大冒險 富貴三袋 100點">🐫💰駱馬大冒險 富貴三袋 100點</option>
                            <option value="🐻💰臺灣黑熊 富貴三袋 100點">🐻💰臺灣黑熊 富貴三袋 100點</option>
                            <option value="🐻臺灣黑熊金鑽版  100點">🐻臺灣黑熊金鑽版  100點</option>
                            <option value="🐲龍舟  100點">🐲龍舟  100點</option>
                            <option value="🎭變臉金鑽版  100點">🎭變臉金鑽版  100點</option>
                            <option value="🏙️黃金迷城  100點">🏙️黃金迷城  100點</option>
                            <option value="🐵悟空黄金版  100點">🐵悟空黄金版  100點</option>
                            <option value="🧨金龍爆喜  100點">🧨金龍爆喜  100點</option>
                            <option value="🀄金喜麻將  100點">🀄金喜麻將  100點</option>
                            <option value="🎉霹靂遊俠 100點">🎉霹靂遊俠 100點</option>
                            <option value="🚪芝麻開門 100點">🚪芝麻開門 100點</option>
                            <option value="🌀扭轉乾坤包  800點">🌀扭轉乾坤包  800點</option>
                            <option value="🌟元素速結包  1000點">🌟元素速結包  1000點</option>
                            <option value="💰財運久久包  1500點">💰財運久久包  1500點</option>
                            <option value="🐦雀黃金鑽包  2500點">🐦雀黃金鑽包  2500點</option>
                            <option value="🏆榮耀傳奇包  5000點">🏆榮耀傳奇包  5000點</option>
                        </optgroup>
                    </select>
                </div>
                <!-- 已選擇的品項顯示區 -->
                <div id="selectedItemsBox" class="border rounded-xl p-2 min-h-16 max-h-40 overflow-y-auto flex flex-col gap-1 mt-1">
                    <span class="text-[11px] opacity-50 italic">尚未選擇品項（從上方下拉選單點擊即可加入）</span>
                </div>
            </div>

            <!-- 第二行：輸入框 (數學算式) = 結果 -->
            <div class="flex flex-col gap-1.5">
                <label id="label2" class="text-xs font-bold">2. 數學算式（會自動計算結果）：</label>
                <div class="flex items-center gap-2">
                    <input type="text" id="calcInput" placeholder="例如: 239-100-100" oninput="calculateMath()"
                        class="flex-1 border rounded-xl px-3 py-2 text-xs focus:outline-none">
                    <span id="calcResultDisplay" class="text-xs font-bold px-3 py-2 rounded-xl whitespace-nowrap">
                        = 0
                    </span>
                </div>
            </div>

            <!-- 第三行：固定確認文字 -->
            <div class="flex flex-col gap-1.5">
                <label id="label3" class="text-xs font-bold">3. 固定結尾文字：</label>
                <input type="text" id="fixedText" value="跟您確認一下" readonly
                    class="border rounded-xl px-3 py-2 text-xs cursor-not-allowed opacity-75">
            </div>

            <!-- 即時預覽畫面 -->
            <div class="flex flex-col gap-1">
                <label id="label4" class="text-xs font-bold">📋 最終輸出預覽：</label>
                <div id="livePreview" class="bg-zinc-950 text-emerald-400 font-mono text-xs p-3 rounded-2xl whitespace-pre-line min-h-16">
                    (請在上方選擇品項與輸入算式)
                </div>
            </div>

            <!-- 一鍵複製按鈕 -->
            <button id="formatCopyBtn" onclick="copyFormattedText()" class="w-full font-medium py-3 rounded-2xl shadow-md transition-all active:scale-95 cursor-pointer text-sm text-white">
                ✨ 一鍵複製排版結果
            </button>
        </div>
    </div>

        function adjustZoom(amount) {
            currentZoom += amount;
            if (currentZoom < 0.7) currentZoom = 0.7;
            if (currentZoom > 1.6) currentZoom = 1.6;
            currentZoom = Math.round(currentZoom * 10) / 10;
            sessionStorage.setItem('cafe_page_zoom', currentZoom);
            applyZoom();
        }

        function applyZoom() {
            const container = document.getElementById('mainContainer');
            container.style.transform = `scale(${currentZoom})`;
            container.style.transformOrigin = 'top center';
        }

        function saveToLocalStorage() {
            localStorage.setItem('cafe_custom_buttons', JSON.stringify(buttonsData));
            localStorage.setItem('cafe_buttons_expanded', JSON.stringify(expandedState));
        }

        function renderButtons() {
            const container = document.getElementById('buttonContainer');
            container.innerHTML = '';
            const currentThemeName = localStorage.getItem('cafe_theme_style') || 'blueberry';
            const t = themes[currentThemeName] || themes.blueberry;

            if (buttonsData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-60 text-sm">這裡空空如也～快點上方「新增按鈕」建立一個吧！🍡</div>`;
                return;
            }

            buttonsData.forEach((btn, index) => {
                const buttonElement = document.createElement('div');
                buttonElement.draggable = isDeleteMode;
                buttonElement.dataset.index = index;
                const isExpanded = !!expandedState[btn.id];

                if (isDeleteMode) {
                    const textClass = isExpanded ? "w-full break-all leading-relaxed text-[#D32F2F]" : "w-full truncate text-[#D32F2F]";
                    buttonElement.className = `w-full py-4 px-6 rounded-3xl font-medium text-base shadow-sm transition-all duration-200 flex items-center justify-between gap-3 border text-left bg-[#FFEBEE] border-[#EF9A9A] cursor-grab active:cursor-grabbing select-none`;
                    buttonElement.innerHTML = `
                        <span class="${textClass}">${escapeHTML(btn.text)}</span>
                        <button onclick="event.stopPropagation(); deleteButton(${btn.id})" class="bg-[#D32F2F] hover:bg-[#B71C1C] text-white text-xs px-3 py-2 rounded-xl shrink-0 transition-all cursor-pointer shadow-sm active:scale-95">🗑️ 刪除</button>
                    `;
                    buttonElement.ondblclick = (e) => {
                        e.stopPropagation();
                        expandedState[btn.id] = !isExpanded;
                        saveToLocalStorage();
                        renderButtons();
                    };
                } else {
                    const textClass = isExpanded ? "w-full break-all leading-relaxed" : "w-full truncate";
                    buttonElement.className = `w-full py-4 px-6 rounded-3xl font-medium text-base shadow-sm transition-all duration-200 flex items-center justify-between gap-3 border text-left hover:shadow-md cafe-hover cursor-pointer ${t.normalBtn}`;
                    buttonElement.innerHTML = `
                        <span class="${textClass}">${escapeHTML(btn.text)}</span>
                        <span class="text-xs opacity-60 shrink-0">📋 複製</span>
                    `;
                    buttonElement.onclick = () => copyText(btn.text);
                }

                buttonElement.addEventListener('dragstart', (e) => {
                    draggedIndex = index;
                    e.dataTransfer.effectAllowed = 'move';
                    setTimeout(() => buttonElement.classList.add('dragging'), 0);
                });
                buttonElement.addEventListener('dragend', () => {
                    buttonElement.classList.remove('dragging');
                    draggedIndex = null;
                });
                buttonElement.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                buttonElement.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedIndex === null || draggedIndex === index) return;
                    const movedItem = buttonsData.splice(draggedIndex, 1)[0];
                    buttonsData.splice(index, 0, movedItem);
                    draggedIndex = index;
                    saveToLocalStorage();
                    renderButtons();
                });

                container.appendChild(buttonElement);
            });
        }

        // 🎁 快速排版面板互動邏輯
        function openFormatModal() {
            const modal = document.getElementById('formatModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            updatePreview();
        }

        function closeFormatModal() {
            const modal = document.getElementById('formatModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function handleFormatModalClick(event) {
            if (event.target.id === 'formatModal') {
                closeFormatModal();
            }
        }

        // 🔄 重置按鈕：清空 1 (已選品項) 與 2 (數學算式)
        function resetFormatForm() {
            chosenItems = [];
            renderSelectedItems();
            document.getElementById('calcInput').value = '';
            document.getElementById('calcResultDisplay').innerText = '= 0';
            document.getElementById('itemSelector').selectedIndex = 0;
            updatePreview();
        }

        // 下拉選單選擇時直接加入
        function handleItemSelect(selectElement) {
            const val = selectElement.value;
            if (!val) return;
            chosenItems.push(val);
            selectElement.selectedIndex = 0; // 加入後自動歸位到提示選項
            renderSelectedItems();
            updatePreview();
        }

        function removeSelectedItem(index) {
            chosenItems.splice(index, 1);
            renderSelectedItems();
            updatePreview();
        }

        function renderSelectedItems() {
            const box = document.getElementById('selectedItemsBox');
            const currentThemeName = localStorage.getItem('cafe_theme_style') || 'blueberry';
            const t = themes[currentThemeName] || themes.blueberry;

            if (chosenItems.length === 0) {
                box.innerHTML = `<span class="text-[11px] opacity-50 italic">尚未選擇品項（從上方下拉選單點擊即可加入）</span>`;
                return;
            }
            box.innerHTML = '';
            chosenItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between px-2.5 py-1.5 rounded-xl text-xs ${t.tagBg}`;
                div.innerHTML = `
                    <span>${escapeHTML(item)}</span>
                    <button onclick="removeSelectedItem(${idx})" class="text-red-500 hover:text-red-700 font-bold px-1 cursor-pointer">✕</button>
                `;
                box.appendChild(div);
            });
        }

        function calculateMath() {
            const inputVal = document.getElementById('calcInput').value.trim();
            const resultDisplay = document.getElementById('calcResultDisplay');
            if (!inputVal) {
                resultDisplay.innerText = `= 0`;
                updatePreview();
                return;
            }
            try {
                const sanitized = inputVal.replace(/[^0-9+\-*/().]/g, '');
                if (!sanitized) {
                    resultDisplay.innerText = `= 0`;
                    updatePreview();
                    return;
                }
                const res = Function(`return (${sanitized})`)();
                resultDisplay.innerText = `= ${isFinite(res) ? res : '錯誤'}`;
            } catch (e) {
                resultDisplay.innerText = `= 計算中`;
            }
            updatePreview();
        }

        function updatePreview() {
            const calcVal = document.getElementById('calcInput').value.trim();
            const resultText = document.getElementById('calcResultDisplay').innerText;
            const fixed = document.getElementById('fixedText').value;

            let lines = [];
            chosenItems.forEach(item => lines.push(item));
            if (calcVal) {
                lines.push(`${calcVal} ${resultText}`);
            }
            lines.push(fixed);

            const previewBox = document.getElementById('livePreview');
            if (lines.length === 0 || (chosenItems.length === 0 && !calcVal)) {
                previewBox.innerText = "(請在上方選擇品項與輸入算式)";
            } else {
                previewBox.innerText = lines.join('\n');
            }
        }

        function copyFormattedText() {
            const calcVal = document.getElementById('calcInput').value.trim();
            const resultText = document.getElementById('calcResultDisplay').innerText;
            const fixed = document.getElementById('fixedText').value;

            let lines = [];
            chosenItems.forEach(item => lines.push(item));
            if (calcVal) {
                lines.push(`${calcVal} ${resultText}`);
            }
            lines.push(fixed);

            const finalText = lines.join('\n');
            if (!finalText.trim() || (chosenItems.length === 0 && !calcVal)) {
                alert('請至少選擇一個品項或輸入算式喔！');
                return;
            }
            copyText(finalText);
            closeFormatModal();
        }

        // 一般按鈕邏輯
        function openModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('buttonNameInput').value = '';
            document.getElementById('quickMenu').classList.add('hidden');
            setTimeout(() => document.getElementById('buttonNameInput').focus(), 50);
        }

        function handleModalClick(event) {
            if (event.target.id === 'modal') { closeModal(); }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function toggleQuickMenu() {
            document.getElementById('quickMenu').classList.toggle('hidden');
        }

        function addQuickText(text) {
            document.getElementById('buttonNameInput').value = text;
            createNewButton();
        }

        function createNewButton() {
            const input = document.getElementById('buttonNameInput');
            const text = input.value.trim();
            if (!text) { alert('請輸入按鈕名稱喔！'); return; }
            buttonsData.push({ id: Date.now(), text: text });
            saveToLocalStorage();
            renderButtons();
            closeModal();
        }

        function toggleDeleteMode() {
            isDeleteMode = !isDeleteMode;
            const toggleBtn = document.getElementById('deleteToggleBtn');
            const zoomBar = document.getElementById('zoomControlBar');
            const currentThemeName = localStorage.getItem('cafe_theme_style') || 'blueberry';
            const t = themes[currentThemeName] || themes.blueberry;
            document.getElementById('themeMenu').classList.add('hidden');

            if (isDeleteMode) {
                toggleBtn.className = "bg-[#D32F2F] text-white font-medium py-2.5 px-4 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-sm cursor-pointer border border-[#B71C1C]";
                toggleBtn.innerText = "❌ 編輯模式";
                zoomBar.classList.remove('hidden');
                zoomBar.classList.add('flex');
            } else {
                toggleBtn.className = `font-medium py-2.5 px-4 rounded-full shadow-sm transition-all duration-200 active:scale-95 text-sm cursor-pointer border ${t.editBtn}`;
                toggleBtn.innerText = "✨ 編輯模式";
                zoomBar.classList.remove('flex');
                zoomBar.classList.add('hidden');
            }
            renderButtons();
        }

        function deleteButton(id) {
            buttonsData = buttonsData.filter(btn => btn.id !== id);
            delete expandedState[id];
            saveToLocalStorage();
            renderButtons();
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast()).catch(() => fallbackCopyText(text));
            } else {
                fallbackCopyText(text);
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert('複製失敗，請手動複製');
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1500);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

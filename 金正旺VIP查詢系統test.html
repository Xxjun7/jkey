<!DOCTYPE html>
<html lang="zh-TW">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <link rel="icon" type="image/x-icon" href="./Jicon.ico">

  <meta property="og:title" content="金正旺">
  <meta property="og:description" content="VIP查詢系統">

  <title>金正旺VIP查詢系統</title>


  <style>

    /* ========================================
       基本
       ======================================== */

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      color: #ffffff;

      margin: 0;
      padding: 16px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
      min-height: 100dvh;

      box-sizing: border-box;

      touch-action: pan-x pan-y;

      -webkit-user-select: none;
      user-select: none;

      background-image:
        url('https://lh3.googleusercontent.com/pw/AP1GczPMHaF7waxnhrEtXYsPAGS6rVI4LxOdwlTZwmrjZmMuYytOLZV1Z59x6T03KM39kRaRI1h8qe2ZpUzOTbBIS8rwn30KfhEk_cLEY8MuQutCF30OUACklEM7qO-478-XV1hYBzubTndfAkdo7_hOMf8L=w728-h1024-s-no-gm?authuser=0');

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* ========================================
       主容器
       ======================================== */

    .container {

      width: 100%;
      max-width: 500px;

      background: rgba(0, 0, 0, 0.65);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      padding: 20px;

      border-radius: 16px;

      box-shadow:
        0 8px 32px
        rgba(0, 0, 0, 0.37);

      box-sizing: border-box;

      touch-action: manipulation;
    }


    /* ========================================
       標題
       ======================================== */

    h2 {

      font-size: 1.4rem;

      margin-top: 0;
      margin-bottom: 20px;

      text-align: center;

      letter-spacing: 1.5px;

      font-weight: bold;

      background:
        linear-gradient(
          90deg,
          #bf953f,
          #fcf6ba,
          #b38728,
          #fbf5b7,
          #aa771c
        );

      background-size: 200% auto;

      color: transparent;

      -webkit-background-clip: text;
      background-clip: text;

      animation:
        shine 3s linear infinite;

      text-shadow:
        0 0 15px
        rgba(212, 175, 55, 0.4);
    }


    @keyframes shine {

      to {
        background-position: 200% center;
      }

    }


    /* ========================================
       輸入區
       ======================================== */

    .input-group {

      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }


    input[type="text"] {

      flex: 1;

      padding: 12px;

      font-size: 16px;

      border:
        1px solid
        rgba(255, 255, 255, 0.3);

      background:
        rgba(255, 255, 255, 0.1);

      color: #ffffff;

      border-radius: 8px;

      outline: none;

      transition:
        border-color 0.2s,
        background 0.2s;

      -webkit-appearance: none;

      -webkit-user-select: text;
      user-select: text;

      touch-action: manipulation;
    }


    input[type="text"]::placeholder {

      color:
        rgba(255, 255, 255, 0.6);
    }


    input[type="text"]:focus {

      border-color: #fcf6ba;

      background:
        rgba(255, 255, 255, 0.15);
    }


    /* ========================================
       一般按鈕
       ======================================== */

    button,
    .btn {

      padding: 12px 16px;

      font-size: 1rem;

      font-weight: 500;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      text-decoration: none;

      display: inline-block;

      text-align: center;

      touch-action: manipulation;

      box-sizing: border-box;
    }


    button:active,
    .btn:active {

      transform: scale(0.98);
    }


    /* ========================================
       查詢按鈕
       ======================================== */

    .btn-query {

      background:
        linear-gradient(
          135deg,
          #bf953f,
          #fcf6ba,
          #aa771c
        );

      color: #222222;

      font-weight: bold;

      box-shadow:
        0 0 10px
        rgba(212, 175, 55, 0.4);

      animation:
        breathe 2.5s ease-in-out infinite;
    }


    .btn-query:hover {

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #fff8dc,
          #c5a059
        );

      box-shadow:
        0 0 20px
        rgba(252, 246, 186, 0.8);
    }


    @keyframes breathe {

      0%,
      100% {

        box-shadow:
          0 0 5px
          rgba(212, 175, 55, 0.3);

        filter: brightness(0.95);
      }

      50% {

        box-shadow:
          0 0 18px
          rgba(252, 246, 186, 0.8);

        filter: brightness(1.08);
      }

    }


    /* ========================================
       LINE
       ======================================== */

    .btn-line {

      background-color: #00c300;

      color: #ffffff;

      width: auto;

      box-sizing: border-box;

      margin-top: 16px;

      display: inline-block;
    }


    .btn-line:hover {

      background-color: #00b000;
    }


    /* ========================================
       兌換獎品按鈕
       ======================================== */

    .btn-reward {

      width: 100%;

      margin-top: 12px;

      padding: 13px 16px;

      background:
        linear-gradient(
          135deg,
          #8b5a2b,
          #d4af37,
          #8b5a2b
        );

      color: #fff;

      font-weight: bold;

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      box-shadow:
        0 0 12px
        rgba(212, 175, 55, 0.35);
    }


    .btn-reward:hover {

      box-shadow:
        0 0 20px
        rgba(252, 246, 186, 0.65);
    }


    /* ========================================
       Loading
       ======================================== */

    .loading {

      display: none;

      font-size: 0.95rem;

      color: #fcf6ba;

      margin-top: 8px;
    }


    .loading::after {

      content: '';

      display: inline-block;

      animation:
        dots 1.5s infinite
        steps(4, end);
    }


    @keyframes dots {

      0% {
        content: '';
      }

      25% {
        content: '.';
      }

      50% {
        content: '..';
      }

      75% {
        content: '...';
      }

    }


    /* ========================================
       錯誤
       ======================================== */

    #error_message {

      color: #ff6b6b;

      font-size: 0.9rem;

      margin-top: 4px;

      display: block;
    }


    /* ========================================
       查詢時間
       ======================================== */

    #current_time {

      display: block;

      margin-top: 16px;

      font-size: 0.9rem;

      background-image:
        linear-gradient(
          to right,
          #ee9ca7,
          #ffdde1
        );

      -webkit-background-clip: text;

      color: transparent;

      font-weight: bold;
    }


    /* ========================================
       提醒
       ======================================== */

    .notice-box {

      margin-top: 12px;

      padding: 10px 12px;

      background:
        rgba(255, 255, 255, 0.08);

      border-left:
        3px solid
        #fcf6ba;

      border-radius: 4px;

      font-size: 0.88rem;

      line-height: 1.5;

      color: #fceea7;
    }


    /* ========================================
       查詢結果
       ======================================== */

    #order_status {

      width: 100%;

      margin-top: 16px;

      overflow-x: auto;
    }


    #order_status table {

      width: 100%;

      border-collapse: collapse;

      margin-top: 8px;
    }


    #order_status th,
    #order_status td {

      border:
        1px solid
        rgba(255, 255, 255, 0.2);

      padding: 8px;

      text-align: center;

      font-size: 0.95rem;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.05);
    }


    #order_status th {

      background:
        rgba(255, 255, 255, 0.15);
    }


    /* ========================================
       查詢按鈕鎖定
       ======================================== */

    .btn-query:disabled {

      cursor: not-allowed;

      opacity: 0.6;

      filter: grayscale(30%);
    }


    /* ========================================
       兌換 UI 遮罩
       ======================================== */

    .reward-overlay {

      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.72);

      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);

      display: none;

      align-items: center;
      justify-content: center;

      padding: 16px;

      box-sizing: border-box;

      z-index: 5000;
    }


    .reward-overlay.show {

      display: flex;
    }


    /* ========================================
       兌換面板
       ======================================== */

    .reward-modal {

      width: 100%;

      max-width: 460px;

      max-height: 90dvh;

      overflow-y: auto;

      background:
        linear-gradient(
          180deg,
          rgba(25, 20, 10, 0.97),
          rgba(0, 0, 0, 0.97)
        );

      border:
        1px solid
        rgba(252, 246, 186, 0.35);

      border-radius: 18px;

      padding: 20px;

      box-sizing: border-box;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.65);
    }


    /* ========================================
       兌換標題
       ======================================== */

    .reward-title {

      text-align: center;

      font-size: 1.25rem;

      font-weight: bold;

      color: #fcf6ba;

      margin-bottom: 18px;
    }


    /* ========================================
       關閉
       ======================================== */

    .reward-close {

      position: absolute;

      margin-left: -42px;

      margin-top: -8px;

      width: 34px;
      height: 34px;

      padding: 0;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.12);

      color: #ffffff;

      font-size: 20px;

      line-height: 34px;

      text-align: center;
    }


    /* ========================================
       選擇品項文字
       ======================================== */

    .reward-label {

      display: block;

      margin-bottom: 8px;

      color: #fceea7;

      font-size: 0.92rem;

      font-weight: bold;
    }


    /* ========================================
       下拉選單
       ======================================== */

    #reward_select {

      width: 100%;

      padding: 13px 12px;

      border-radius: 10px;

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      background:
        rgba(255, 255, 255, 0.1);

      color: #ffffff;

      font-size: 16px;

      outline: none;

      box-sizing: border-box;
    }


    #reward_select option {

      color: #222222;

      background: #ffffff;
    }


    /* ========================================
       已選品項
       ======================================== */

    .selected-title {

      margin-top: 18px;

      margin-bottom: 8px;

      color: #fceea7;

      font-size: 0.92rem;

      font-weight: bold;
    }


    #selectedItemsBox {

      min-height: 45px;

      padding: 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.06);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      box-sizing: border-box;
    }


    .empty-selected {

      color:
        rgba(255, 255, 255, 0.45);

      font-size: 0.88rem;

      text-align: center;

      padding: 5px;
    }


    .selected-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      padding: 9px 10px;

      margin-bottom: 7px;

      background:
        rgba(212, 175, 55, 0.13);

      border:
        1px solid
        rgba(212, 175, 55, 0.3);

      border-radius: 8px;

      color: #ffffff;

      font-size: 0.92rem;
    }


    .selected-item:last-child {

      margin-bottom: 0;
    }


    .remove-item {

      flex-shrink: 0;

      width: 28px;
      height: 28px;

      padding: 0;

      border-radius: 50%;

      background:
        rgba(255, 107, 107, 0.2);

      color: #ff8d8d;

      font-size: 16px;

      line-height: 28px;
    }


    /* ========================================
       即時預覽
       ======================================== */

    .preview-title {

      margin-top: 18px;

      margin-bottom: 8px;

      color: #fceea7;

      font-size: 0.92rem;

      font-weight: bold;
    }


    #reward_preview {

      padding: 13px;

      min-height: 70px;

      box-sizing: border-box;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.05);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      color: #ffffff;

      white-space: pre-line;

      line-height: 1.6;

      font-size: 0.9rem;
    }


    /* ========================================
       LINE 發送
       ======================================== */

    .btn-send-line {

      width: 100%;

      margin-top: 16px;

      background:
        linear-gradient(
          135deg,
          #00c300,
          #00a900
        );

      color: #ffffff;

      font-weight: bold;

      box-shadow:
        0 0 12px
        rgba(0, 195, 0, 0.3);
    }


    .btn-send-line:disabled {

      opacity: 0.45;

      cursor: not-allowed;
    }


    /* ========================================
       兌換讀取中
       ======================================== */

    .reward-loading {

      text-align: center;

      color: #fcf6ba;

      padding: 18px 5px;

      font-size: 0.95rem;
    }


    /* ========================================
       Copyright
       ======================================== */

    .copyright {

      position: fixed;

      bottom: 8px;

      right: 12px;

      font-size: 0.75rem;

      color:
        rgba(255, 255, 255, 0.5);

      letter-spacing: 0.5px;

      pointer-events: none;

      z-index: 999;
    }


    /* ========================================
       手機
       ======================================== */

    @media (max-width: 480px) {

      .container {

        padding: 18px;
      }

      .reward-modal {

        padding: 18px;

        max-height: 88dvh;
      }

      .reward-close {

        margin-left: -40px;
      }

    }

  </style>


  <script>

    // ========================================
    // 全域 API
    // ========================================

    let API_URL = "";

    let API_READY = false;


    // ========================================
    // 目前會員
    // ========================================

    let currentMemberUid = "";

    let currentMemberPoints = "";


    // ========================================
    // 兌換獎品
    // ========================================

    let rewards = [];

    let selectedItems = [];


    // ========================================
    // 防止右鍵
    // ========================================

    document.addEventListener(
      "contextmenu",
      function(e) {

        e.preventDefault();

      }
    );


    // ========================================
    // 防止快捷鍵
    // ========================================

    document.addEventListener(
      "keydown",
      function(e) {

        if (e.key === "F12") {

          e.preventDefault();

          return false;
        }


        if (
          e.ctrlKey &&
          e.shiftKey &&
          (
            e.key === "I" ||
            e.key === "i" ||
            e.key === "J" ||
            e.key === "j" ||
            e.key === "C" ||
            e.key === "c"
          )
        ) {

          e.preventDefault();

          return false;
        }


        if (
          e.ctrlKey &&
          (
            e.key === "U" ||
            e.key === "u"
          )
        ) {

          e.preventDefault();

          return false;
        }

      }
    );


    // ========================================
    // 防止手機縮放
    // ========================================

    document.addEventListener(
      "gesturestart",
      function(e) {

        e.preventDefault();

      },
      { passive: false }
    );


    document.addEventListener(
      "gesturechange",
      function(e) {

        e.preventDefault();

      },
      { passive: false }
    );


    document.addEventListener(
      "gestureend",
      function(e) {

        e.preventDefault();

      },
      { passive: false }
    );


    document.addEventListener(
      "touchmove",
      function(e) {

        if (
          e.touches &&
          e.touches.length > 1
        ) {

          e.preventDefault();

        }

      },
      { passive: false }
    );


    // ========================================
    // 防止雙擊放大
    // ========================================

    let lastTouchEnd = 0;


    document.addEventListener(
      "touchend",
      function(e) {

        const now = Date.now();


        if (
          now - lastTouchEnd <= 300
        ) {

          e.preventDefault();

        }


        lastTouchEnd = now;

      },
      { passive: false }
    );


    // ========================================
    // DOM 載入
    // ========================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        const uidInput =
          document.getElementById("uid");


        uidInput.addEventListener(
          "click",
          function() {

            this.value = "";

          }
        );


        const rewardSelect =
          document.getElementById("reward_select");


        rewardSelect.addEventListener(
          "change",
          function() {

            const value =
              this.value.trim();


            if (value === "") {

              return;

            }


            // ==================================
            // 可選多個
            // 同一個獎品不重複加入
            // ==================================

            if (
              !selectedItems.includes(value)
            ) {

              selectedItems.push(value);

            }


            this.value = "";

            renderSelectedItems();

          }
        );

      }
    );


    // ========================================
    // 會員查詢
    // ========================================

    async function showHint(str) {

      const errorMsg =
        document.getElementById(
          "error_message"
        );


      const loadingSpan =
        document.getElementById(
          "loading"
        );


      const orderStatus =
        document.getElementById(
          "order_status"
        );


      const currentTimeSpan =
        document.getElementById(
          "current_time"
        );


      const noticeBox =
        document.getElementById(
          "notice_box"
        );


      const queryButton =
        document.querySelector(
          ".btn-query"
        );


      // ====================================
      // 清除空白
      // ====================================

      str = str.trim();


      // ====================================
      // 沒輸入
      // ====================================

      if (str === "") {

        errorMsg.innerText =
          "請輸入 會員號＋貴賓本名";

        orderStatus.innerHTML = "";

        currentTimeSpan.innerText = "";

        noticeBox.style.display =
          "none";

        hideRewardButton();

        return;
      }


      // ====================================
      // 防止重複查詢
      // ====================================

      if (queryButton.disabled) {

        return;

      }


      // ====================================
      // 開始查詢
      // ====================================

      queryButton.disabled = true;

      errorMsg.innerText = "";

      loadingSpan.style.display =
        "inline-block";

      orderStatus.innerHTML = "";

      currentTimeSpan.innerText = "";

      noticeBox.style.display =
        "none";

      hideRewardButton();


      try {

        // ==================================
        // 取得 API 設定
        // ==================================

        const configResponse =
          await fetch(
            "/j808/API/J.json?v=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!configResponse.ok) {

          throw new Error(
            "API_CONFIG_LOAD_ERROR"
          );

        }


        const config =
          await configResponse.json();


        if (
          !config ||
          typeof config.apiUrl !== "string" ||
          config.apiUrl.trim() === ""
        ) {

          throw new Error(
            "API_CONFIG_INVALID"
          );

        }


        API_URL =
          config.apiUrl.trim();

        API_READY = true;


        // ==================================
        // GAS 預熱
        // ==================================

        fetch(
          API_URL +
          (
            API_URL.indexOf("?") === -1
              ? "?"
              : "&"
          ) +
          "warmup=true",
          {
            method: "GET",
            mode: "no-cors"
          }
        )
        .catch(function() {});


        // ==================================
        // 會員查詢
        // ==================================

        const separator =
          API_URL.indexOf("?") === -1
            ? "?"
            : "&";


        const requestUrl =
          API_URL +
          separator +
          "uid=" +
          encodeURIComponent(str);


        const response =
          await fetch(
            requestUrl,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "GAS_REQUEST_ERROR"
          );

        }


        const result =
          await response.json();


        // ==================================
        // 查無會員
        // ==================================

        if (!result.success) {

          errorMsg.innerText =
            result.message ||
            "查無會員";

          orderStatus.innerHTML = "";

          currentTimeSpan.innerText = "";

          noticeBox.style.display =
            "none";

          hideRewardButton();

          return;

        }


        // ==================================
        // 保存目前會員
        // ==================================

        currentMemberUid =
          String(result.uid || str);

        currentMemberPoints =
          result.points;


        // ==================================
        // 顯示會員結果
        // ==================================

        const points =
          result.points;


        orderStatus.innerHTML =
          "<table>" +

            "<tr>" +

              "<th>會員</th>" +

              "<th>目前點數</th>" +

            "</tr>" +

            "<tr>" +

              "<td>" +
              escapeHtml(
                String(result.uid)
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                String(points)
              ) +
              "</td>" +

            "</tr>" +

          "</table>";


        // ==================================
        // 查詢時間
        // ==================================

        const now =
          new Date();


        const formattedTime =
          now.getFullYear() +
          "/" +
          String(
            now.getMonth() + 1
          ).padStart(2, "0") +
          "/" +
          String(
            now.getDate()
          ).padStart(2, "0") +
          " " +
          String(
            now.getHours()
          ).padStart(2, "0") +
          ":" +
          String(
            now.getMinutes()
          ).padStart(2, "0") +
          ":" +
          String(
            now.getSeconds()
          ).padStart(2, "0");


        currentTimeSpan.innerText =
          "查詢時間：" +
          formattedTime;


        // ==================================
        // 顯示提醒
        // ==================================

        noticeBox.style.display =
          "block";


        // ==================================
        // 查詢成功
        // 顯示兌換獎品按鈕
        //
        // 注意：
        // 這裡「沒有」讀兌換DM API
        // ==================================

        showRewardButton();


      } catch (error) {

        console.error(
          "API 查詢錯誤：",
          error
        );


        errorMsg.innerText =
          "連線伺服器失敗，請稍後再試";


        orderStatus.innerHTML = "";

        currentTimeSpan.innerText = "";

        noticeBox.style.display =
          "none";

        hideRewardButton();


      } finally {

        // ==================================
        // 查詢完成
        // ==================================

        loadingSpan.style.display =
          "none";

        queryButton.disabled = false;

        API_READY = false;

        API_URL = "";

      }

    }


    // ========================================
    // 顯示兌換按鈕
    // ========================================

    function showRewardButton() {

      const button =
        document.getElementById(
          "reward_button"
        );


      if (button) {

        button.style.display =
          "block";

      }

    }


    // ========================================
    // 隱藏兌換按鈕
    // ========================================

    function hideRewardButton() {

      const button =
        document.getElementById(
          "reward_button"
        );


      if (button) {

        button.style.display =
          "none";

      }

    }


    // ========================================
    // 開啟兌換 UI
    // ========================================

    async function openRewardModal() {

      // ==================================
      // 必須先有會員
      // ==================================

      if (!currentMemberUid) {

        alert(
          "請先查詢會員"
        );

        return;

      }


      const overlay =
        document.getElementById(
          "reward_overlay"
        );


      const select =
        document.getElementById(
          "reward_select"
        );


      const loading =
        document.getElementById(
          "reward_loading"
        );


      const error =
        document.getElementById(
          "reward_error"
        );


      // ==================================
      // 打開 UI
      // ==================================

      overlay.classList.add("show");


      select.innerHTML =
        '<option value="">讀取獎品中...</option>';


      select.disabled = true;


      loading.style.display =
        "block";


      error.innerText = "";


      // ==================================
      // 清空上一次選擇
      // ==================================

      selectedItems = [];

      renderSelectedItems();


      try {

        // ==================================
        // 如果 API_URL 是空的
        // 重新取得 J.json
        //
        // 這不會查會員
        // ==================================

        let apiUrl =
          API_URL;


        if (!apiUrl) {

          const configResponse =
            await fetch(
              "/j808/API/J.json?v=" +
              Date.now(),
              {
                method: "GET",
                cache: "no-store"
              }
            );


          if (!configResponse.ok) {

            throw new Error(
              "API_CONFIG_LOAD_ERROR"
            );

          }


          const config =
            await configResponse.json();


          if (
            !config ||
            typeof config.apiUrl !== "string" ||
            config.apiUrl.trim() === ""
          ) {

            throw new Error(
              "API_CONFIG_INVALID"
            );

          }


          apiUrl =
            config.apiUrl.trim();

        }


        // ==================================
        // 呼叫 GAS
        //
        // action=rewards
        //
        // GAS：
        // getRewards()
        // ↓
        // 讀取「兌換DM」
        // ==================================

        const separator =
          apiUrl.indexOf("?") === -1
            ? "?"
            : "&";


        const rewardUrl =
          apiUrl +
          separator +
          "action=rewards";


        const response =
          await fetch(
            rewardUrl,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "REWARD_REQUEST_ERROR"
          );

        }


        const result =
          await response.json();


        if (
          !result ||
          !result.success
        ) {

          throw new Error(
            result.message ||
            "讀取獎品失敗"
          );

        }


        // ==================================
        // 取得獎品
        // ==================================

        rewards =
          Array.isArray(result.rewards)
            ? result.rewards
            : [];


        // ==================================
        // 沒有獎品
        // ==================================

        if (rewards.length === 0) {

          select.innerHTML =
            '<option value="">目前沒有可兌換獎品</option>';

          select.disabled = true;

          error.innerText =
            "目前沒有可兌換獎品";

          return;

        }


        // ==================================
        // 建立選單
        // ==================================

        select.innerHTML =
          '<option value="">-- 點此選擇品項直接加入 --</option>';


        rewards.forEach(
          function(item) {

            const option =
              document.createElement(
                "option"
              );


            option.value = item;

            option.textContent = item;


            select.appendChild(
              option
            );

          }
        );


        select.disabled = false;


        // ==================================
        // 更新預覽
        // ==================================

        updatePreview();


      } catch (error) {

        console.error(
          "兌換獎品 API 錯誤：",
          error
        );


        select.innerHTML =
          '<option value="">讀取獎品失敗</option>';


        select.disabled = true;


        error.innerText =
          "讀取獎品失敗，請稍後再試";


      } finally {

        loading.style.display =
          "none";

      }

    }


    // ========================================
    // 關閉兌換 UI
    // ========================================

    function closeRewardModal() {

      const overlay =
        document.getElementById(
          "reward_overlay"
        );


      overlay.classList.remove(
        "show"
      );

    }


    // ========================================
    // 點遮罩關閉
    // ========================================

    function overlayClick(e) {

      if (
        e.target ===
        document.getElementById(
          "reward_overlay"
        )
      ) {

        closeRewardModal();

      }

    }


    // ========================================
    // 顯示已選品項
    // ========================================

    function renderSelectedItems() {

      const box =
        document.getElementById(
          "selectedItemsBox"
        );


      if (!box) {

        return;

      }


      if (
        selectedItems.length === 0
      ) {

        box.innerHTML =
          '<div class="empty-selected">' +
          '尚未選擇品項' +
          '</div>';

        updatePreview();

        return;

      }


      box.innerHTML = "";


      selectedItems.forEach(
        function(item, index) {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "selected-item";


          const text =
            document.createElement(
              "span"
            );


          text.textContent =
            "🎁 " + item;


          const removeButton =
            document.createElement(
              "button"
            );


          removeButton.type =
            "button";


          removeButton.className =
            "remove-item";


          removeButton.textContent =
            "×";


          removeButton.title =
            "移除";


          removeButton.onclick =
            function() {

              selectedItems.splice(
                index,
                1
              );


              renderSelectedItems();

            };


          row.appendChild(text);

          row.appendChild(
            removeButton
          );


          box.appendChild(row);

        }
      );


      updatePreview();

    }


    // ========================================
    // 即時預覽
    // ========================================

    function updatePreview() {

      const preview =
        document.getElementById(
          "reward_preview"
        );


      const sendButton =
        document.getElementById(
          "send_line_button"
        );


      if (
        selectedItems.length === 0
      ) {

        preview.textContent =
          "尚未選擇兌換品項";


        sendButton.disabled =
          true;


        return;

      }


      let text =
        "🎁 兌換獎品\n\n";


      text +=
        "會員：" +
        currentMemberUid +
        "\n";


      text +=
        "目前點數：" +
        currentMemberPoints +
        "\n\n";


      text +=
        "兌換品項：\n";


      selectedItems.forEach(
        function(item, index) {

          text +=
            (index + 1) +
            ". " +
            item +
            "\n";

        }
      );


      text +=
        "\n請官方協助確認兌換，謝謝！";


      preview.textContent =
        text;


      sendButton.disabled =
        false;

    }


    // ========================================
    // 發送給官方 LINE@
    //
    // 注意：
    // LINE 開啟後
    // 使用者仍然要自己按「送出」
    // ========================================

    function sendToOfficialLine() {

      if (
        selectedItems.length === 0
      ) {

        alert(
          "請先選擇兌換獎品"
        );

        return;

      }


      // ==================================
      // 建立 LINE 訊息
      // ==================================

      let message =
        "🎁 兌換獎品\n\n";


      message +=
        "會員：" +
        currentMemberUid +
        "\n";


      message +=
        "目前點數：" +
        currentMemberPoints +
        "\n\n";


      message +=
        "兌換品項：\n";


      selectedItems.forEach(
        function(item, index) {

          message +=
            (index + 1) +
            ". " +
            item +
            "\n";

        }
      );


      message +=
        "\n請官方協助確認兌換，謝謝！";


      // ==================================
      // LINE 官方帳號
      // ==================================

      const lineUrl =
        "https://line.me/R/ti/p/@goldwon888?text=" +
        encodeURIComponent(message);


      // ==================================
      // 開啟 LINE
      // ==================================

      window.location.href =
        lineUrl;

    }


    // ========================================
    // HTML Escape
    // ========================================

    function escapeHtml(value) {

      return value
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</head>


<body>


  <div class="container">


    <h2>
      金正旺VIP查詢系統
    </h2>


    <!-- ====================================

    <!-- ====================================

      <!-- ==================================

    </div>

  </div>


  <div class="copyright">

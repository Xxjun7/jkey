<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>j萬能圖片 URL 圖像處理工具</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: var(--primary-color);
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fff;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .canvas-container {
            width: 100%;
            height: 450px;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 改為 hidden，讓滑鼠拖曳完全掌控 */
            background: #f1f5f9;
            position: relative;
            cursor: grab;
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
            position: absolute;
            transform-origin: center center;
        }

        .hint {
            font-size: 12px;
            color: #64748b;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🖼️ j萬能圖片 URL 圖像處理工具</h2>

    <!-- 1. 圖片來源 -->
    <div class="section">
        <span class="section-title">1. 圖片來源 (網址輸入 / 檔案上傳 / 支援 Ctrl+V 貼上)</span>
        <div class="input-group">
            <input type="text" id="imageUrl" placeholder="請輸入圖片網址 (URL)...">
            <button onclick="loadImageFromUrl()">載入網址</button>
            <input type="file" id="imageFile" accept="image/*" style="display: none;" onchange="loadImageFromFile(event)">
            <button onclick="document.getElementById('imageFile').click()">選擇檔案</button>
        </div>
        <div class="hint">提示：您也可以直接在此頁面任何地方按下 **Ctrl + V** 貼上剪貼簿中的圖片。</div>
    </div>

    <!-- 2. 基本工具 -->
    <div class="section">
        <span class="section-title">2. 編輯與調整工具</span>
        <div class="toolbar">
            <button onclick="rotate(-90)">↶ 向左 90°</button>
            <button onclick="rotate(90)">↷ 向右 90°</button>
            <button onclick="flip('h')">⇄ 水平翻轉</button>
            <button onclick="flip('v')">⇅ 垂直翻轉</button>
            <button onclick="zoom(1.25)">🔍 圖片放大</button>
            <button onclick="zoom(0.8)">🔎 圖片縮小</button>
            <button onclick="resetImage()">🔄 重設原圖</button>
        </div>
    </div>

    <!-- 3. 即時預覽區 -->
    <div class="section">
        <span class="section-title">3. 即時顯示預覽 (可按住滑鼠左鍵拖曳平移)</span>
        <div class="canvas-container" id="canvasContainer">
            <span id="placeholderText" style="color: #94a3b8; position: absolute; z-index: 2;">尚未載入圖片，請貼上、上傳或輸入網址</span>
            <canvas id="imageCanvas" style="display: none;"></canvas>
        </div>
    </div>

    <!-- 4. 輸出格式 -->
    <div class="section">
        <span class="section-title">4. 輸出格式</span>
        <div class="input-group">
            <select id="outputFormat" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);">
                <option value="image/png">PNG (高畫質)</option>
                <option value="image/jpeg">JPEG (小檔案)</option>
            </select>
            <button onclick="saveImage()" style="background-color: #16a34a;">💾 另存圖檔</button>
        </div>
        <div class="hint">註：受限於瀏覽器安全權限，檔案將直接儲存至瀏覽器預設下載夾（若需指定至 <code>C:\Users\User\Desktop\顧客資料夾\</code> 請於瀏覽器下載設定中更改預設下載路徑）。</div>
    </div>
</div>

<script>
    let canvas = document.getElementById('imageCanvas');
    let ctx = canvas.getContext('2d');
    let img = new Image();
    let currentRotation = 0;
    let flipH = 1;
    let flipV = 1;
    let currentScale = 1;
    let originalImageSrc = null;

    // 拖曳平移變數
    let isDragging = false;
    let startX = 0, startY = 0;
    let translateX = 0, translateY = 0;

    const container = document.getElementById('canvasContainer');

    // 監聽 Ctrl + V 貼上圖片
    window.addEventListener('paste', (e) => {
        let items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                let blob = items[i].getAsFile();
                let url = URL.createObjectURL(blob);
                loadAndDisplayImage(url);
                break;
            }
        }
    });

    // 滑鼠拖曳平移事件
    container.addEventListener('mousedown', (e) => {
        if (!img.src) return;
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateCanvasTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    function loadImageFromUrl() {
        let url = document.getElementById('imageUrl').value.trim();
        if (!url) return alert('請輸入圖片網址！');
        loadAndDisplayImage(url);
    }

    function loadImageFromFile(event) {
        let file = event.target.files[0];
        if (file) {
            let url = URL.createObjectURL(file);
            loadAndDisplayImage(url);
        }
    }

    function loadAndDisplayImage(src) {
        img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() {
            originalImageSrc = src;
            currentRotation = 0;
            flipH = 1;
            flipV = 1;
            currentScale = 1;
            translateX = 0;
            translateY = 0;
            drawImage();
            document.getElementById('placeholderText').style.display = 'none';
            canvas.style.display = 'block';
        };
        img.onerror = function() {
            alert('圖片載入失敗，可能是網址不正確或伺服器不允許跨域讀取 (CORS)。');
        };
        img.src = src;
    }

    function drawImage() {
        if (!img.src) return;

        // 依據比例與旋轉計算畫布大小
        let baseWidth = img.width;
        let baseHeight = img.height;

        if (Math.abs(currentRotation) % 180 === 90) {
            canvas.width = baseHeight;
            canvas.height = baseWidth;
        } else {
            canvas.width = baseWidth;
            canvas.height = baseHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((currentRotation * Math.PI) / 180);
        ctx.scale(flipH, flipV);
        
        ctx.drawImage(img, -baseWidth / 2, -baseHeight / 2, baseWidth, baseHeight);
        ctx.restore();

        updateCanvasTransform();
    }

    function updateCanvasTransform() {
        // 以中心點進行縮放與平移
        canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
    }

    function rotate(angle) {
        currentRotation = (currentRotation + angle) % 360;
        drawImage();
    }

    function flip(direction) {
        if (direction === 'h') flipH *= -1;
        if (direction === 'v') flipV *= -1;
        drawImage();
    }

    function zoom(factor) {
        currentScale *= factor;
        // 限制縮放極限避免過大或過小
        if (currentScale < 0.1) currentScale = 0.1;
        if (currentScale > 20) currentScale = 20;
        updateCanvasTransform();
    }

    function resetImage() {
        if (!originalImageSrc) return;
        currentRotation = 0;
        flipH = 1;
        flipV = 1;
        currentScale = 1;
        translateX = 0;
        translateY = 0;
        drawImage();
    }

    function saveImage() {
        if (!img.src) return alert('目前沒有可儲存的圖片！');
        let format = document.getElementById('outputFormat').value;
        let link = document.createElement('a');
        link.download = 'processed_image_' + Date.now() + (format === 'image/jpeg' ? '.jpg' : '.png');
        link.href = canvas.toDataURL(format);
        link.click();
    }
</script>

</body>
</html>
